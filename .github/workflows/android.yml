name: Android CI

on:
  push:
    branches: ["master", "develop"]
  pull_request:
    branches: ["master", "develop"]

jobs:
  # 1️⃣ Build & Test
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write        # benötigt, falls du OIDC‑auth mit Sentry nutzt
      # ── nur die Schritte, die du brauchst ──
      # id-token: write  # optional, wenn du z.B. GCP/GitHub Packages veröffentlichen willst

    env:
      # ── Sentry‑Konfiguration (nur die wichtigsten) ──
      SENTRY_ORG: privat-jb
      SENTRY_PROJECT: vivid
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant executable permission to gradlew
        run: chmod +x ./gradlew

      # Debug-Variante deckt alle Module ab (app, core, data, domain, feature-*);
      # Tests liegen in src/test — keine Release-Varianten-Tests im Projekt.
      - name: Run unit tests (all modules)
        run: ./gradlew testDebugUnitTest

      - name: Run lint & static analysis
        run: ./gradlew lintDebug

      # Changelog-Generator (bash) — deterministischer Test ohne Netzwerk (Fake-gh)
      - name: Test changelog script
        run: bash scripts/test_update_changelog.sh

      # ── Optional: Code‑Scanning / Security‑Events ──
      # - name: Run CodeQL
      #   uses: github/codeql-action/init@v2
      #   with:
      #     languages: java

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**

  # 2️⃣ Release (nur auf `main` bzw. wenn der PR auf `main` gemergt wird)
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build          # wartet auf den erfolgreichen Build‑Job
    if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]' && !contains(github.event.commits.*.author.username, 'dependabot[bot]')
    permissions:
      contents: read
      packages: read
      id-token: write

    env:
      SENTRY_ORG: privat-jb
      SENTRY_PROJECT: vivid
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # ── Keystore dekodieren (KEYSTORE_* Secrets, identisch zum fastlane-Workflow) ──
      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -di > ${{ github.workspace }}/release.keystore
          echo "KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> "$GITHUB_ENV"

      # ── Release Build (signiert) — Signing-Env-Vars liest app/build.gradle.kts ──
      - name: Assemble signed release APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      # ── Artifact‑Upload ──
      - name: Upload APK as artifact
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v6
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 5
