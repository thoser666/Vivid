name: Security / CodeQL

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:
  schedule:
    # Wöchentlich Mo 04:00 UTC — Default-Branch-Scan unabhängig von PRs.
    - cron: "0 4 * * 1"

permissions: {}

# Permissions are scoped to the analysis job below.
# Ein aktiver Lauf pro Branch/PR — bei Re-Push wird der alte abgebrochen.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (Kotlin/Java)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        language: [ java-kotlin ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 25 (LTS)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "25"

      # SHA-Pins (Supply-Chain), konsistent mit der CI-Härtung in RELEASE.md:
      # Beide Actions stammen aus demselben Release-Tag v4.38.0 (aktuellster
      # Stand, released 09.09.2026). ACHTUNG Bundle-Lag (github/codeql#22404):
      # das Default-Bundle 2.27.0 lehnt Kotlin 2.4.20 noch ab („supports
      # versions below 2.4.20") — deshalb pinnt der Step unten davor den
      # Trace-Build auf Kotlin 2.4.10 (bewährtes KSP-2.3.11-Paar, < 2.4.20).
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          # Security-relevante Query-Pakete zusätzlich zum Standard.
          queries: security-extended,security-and-quality

      # Manueller statt Autobuild: deterministisch kt-Kompilierung des App-Moduls
      # (CodeQL traced die Build-Schritte für Datenfluss-Analyse).
      - name: Pin Kotlin for CodeQL extractor (github/codeql#22404)
        run: |
          KOTLIN=$(grep -m1 '^kotlin = ' gradle/libs.versions.toml | sed 's/.*"\([^"]*\)".*/\1/')
          if [ -n "$KOTLIN" ] && [ "$KOTLIN" != "2.4.10" ]; then
            echo "CodeQL-Extractor: Kotlin $KOTLIN → 2.4.10 (Bundle 2.27.0 limitiert auf < 2.4.20, github/codeql#22404)"
            sed -i "s/^kotlin = \"$KOTLIN\"/kotlin = \"2.4.10\"/" gradle/libs.versions.toml
            sed -i "s/^jetbrainsKotlinJvm = \"$KOTLIN\"/jetbrainsKotlinJvm = \"2.4.10\"/" gradle/libs.versions.toml
          else
            echo "CodeQL-Extractor: Kotlin $KOTLIN bereits kompatibel (< 2.4.20)"
          fi

      - name: Build Debug APK (CodeQL trace)
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:${{ matrix.language }}"