name: Distribution / Stable (weekly)

# ✅ WÖCHENTLICHE Stable-Distribution (seit 10.09.2026):
#   - Mo 03:00 UTC sucht dieser Workflow die neueste noch NICHT (vollständig)
#     verteilte v*-Version und publiziert sie als Stable-GitHub-Release
#     (beide Flavor-APKs + SHA256SUMS, siehe fastlane/Fastfile release_github).
#   - Der anschließend eintreffende F-Droid-Repo-Build (deploy-fdroid.yml,
#     Mo 04:00 UTC) nimmt das Release dieselbe Woche auf.
#   - Nightly (täglich 06:00 UTC) läuft UNVERÄNDERT in release-pipeline.yml.
#   - Nach dem Publish signiert ein cosign keyless-Step die SHA256SUMS.txt und
#     hängt die Signatur (.sig/.crt) ans Release — Completeness = 4 Assets.
#
# Warum ein eigener Workflow und kein zweiter Cron in release-pipeline.yml?
# GitHub unterscheidet nicht, welcher Cron einen Schedule-Run ausgelöst hat —
# ein zweiter Cron im selben Workflow hätte den publish-release-Job täglich
# (stabil) laufen lassen. Der Trennung: release-pipeline = nightly,
# diese Datei = stable.
#
# Manuell auslösbar (z. B. Nachholen einer verpassten Woche):
#   gh workflow run distribution-stable.yml --ref develop --field version=v0.6.0-beta

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact tag to publish (e.g. v0.6.0-beta); default: newest not yet distributed'
        required: false
        type: string

permissions:
  contents: read

# Serialisiert die Wochen-Publikation. cancel-in-progress: false ist BEWUSST:
# der laufende Run muss Release-Create + CHANGELOG immer zu Ende bringen —
# ein Abbruch mitten in der Kette hinterlässt halb erstellte Releases.
concurrency:
  group: distribution-stable
  cancel-in-progress: false

jobs:
  publish-stable:
    name: Publish latest undelivered stable version
    runs-on: ubuntu-latest
    # Keine Bot-Läufe (Loop-Schutz analog release-pipeline).
    if: github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      pull-requests: write
      checks: read # Auto-Merge: Pflicht-Checks der Bot-PRs pollen (GITHUB_TOKEN)
      # OIDC für cosign keyless (sign-blob nutzt das ambient GitHub-Action-Token).
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Volle History: Versionableitung + Tag-Auswahl (fetch all tags/branches)
          fetch-depth: 0

      - name: Set up JDK 25 (LTS)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ✅ Ziel-Tag bestimmen:
      #   - Dispatch-Input überschreibt (validiert gegen das vX.Y.Z-Format)
      #   - sonst: neueste v*-Version (Semver-Sortierung) OHNE vollständiges
      #     Release bzw. MIT unvollständigem Release (wird repariert)
      #   - alles verteilt → clean exit 0 (kein Fehlschlag-Alarm)
      - name: Determine target stable version
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
            if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+'; then
              echo "::error::version-Input '$TAG' entspricht nicht ^vX.Y.Z…"
              exit 1
            fi
            if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
              echo "::error::Tag $TAG existiert nicht — vorher pushen (fastlane release_alpha)."
              exit 1
            fi
            echo "Dispatch-Input: $TAG (erzwungen)"
          else
            CHOSEN=""
            for TAG in $(git tag -l "v*" --sort=-v:refname); do
              # Vollständigkeit = published (kein Draft, kein Prerelease) und
              # BEIDE Flavor-APKs + SHA256SUMS + cosign-Sigstore-Bundle (.bundle) als
              # Assets (Mitanspruch: Repair-Pfad deckt Releases ohne Bundle).
              # gh release view schlägt fehl (RC≠0) ⇒ Tag noch nie veröffentlicht.
              if out=$(gh release view "$TAG" --json isDraft,isPrerelease,assets 2>/dev/null); then
                if echo "$out" | jq -e '.isDraft == false and .isPrerelease == false and ([.assets[].name] | index("app-standard-release.apk")) and ([.assets[].name] | index("app-foss-release.apk")) and ([.assets[].name] | index("SHA256SUMS.txt")) and ([.assets[].name] | index("SHA256SUMS.txt.bundle"))' >/dev/null 2>&1; then
                  echo "  $TAG: bereits vollständig verteilt — übersprungen"
                  continue
                fi
                echo "  $TAG: Release vorhanden, aber unvollständig — wird repariert"
              else
                echo "  $TAG: noch kein Release — wird veröffentlicht"
              fi
              CHOSEN="$TAG"
              break
            done
            if [ -z "$CHOSEN" ]; then
              echo "::notice::Alle v*-Versionen sind bereits vollständig als stable Release verteilt — nichts zu tun."
              echo "NO_TARGET=true" >> "$GITHUB_ENV"
              exit 0
            fi
            TAG="$CHOSEN"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing stable release: $TAG"

      # ⏭ Kein Ziel-Tag (alles verteilt) → Früh-Exit. Subsequente Steps laufen
      # sonst mit leerem $TAG → Guard setzt sie auf no-op. Sauber via sentinel.
      - name: Checkout target tag
        if: env.TAG != ''
        run: |
          git checkout "$TAG"
          echo "Checked out $TAG (HEAD=$(git rev-parse --short HEAD))"

      # ✅ Keystore dekodieren (wenn vorhanden) — identische Härtung wie die
      # release-Pipeline: ohne Release-Key wird nicht publiziert (Debug-Signatur
      # würde Obtainium-/F-Droid-Updates brechen).
      - name: Decode Keystore
        if: env.TAG != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 fehlt — Release müsste mit Debug-Key signiert werden. Abbruch."
            exit 1
          fi
          echo $KEYSTORE_BASE64 | base64 -di > ${{ github.workspace }}/release.keystore
          echo "KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV

      # ── Emulator-Gate (vor dem Publish, gefordert 24.09.2026) ───────────────
      # Die instrumentierten UI-Tests (HelpNavigationTest + PlayScreenshotsTest)
      # laufen auf einem echten Emulator gegen den ZIEL-TAG — der Job hat den
      # Tag ohnehin ausgecheckt, also wird exakt das getestet, was publiziert
      # werden soll. Nur die authority-fähige Leg (ubuntu-x86_64 mit KVM,
      # Vorfall 06.09.2026: udev-Regel ist Pflicht, sonst Boot-Timeout).
      - name: Enable KVM group perms (emulator gate)
        if: env.TAG != ''
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests on emulator (release gate)
        if: env.TAG != ''
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: 900
          script: |
            # Flavor-explicit (connectedDebugAndroidTest ist in diesem Projekt
            # wegen der Varianten foss/standard mehrdeutig).
            ./gradlew :app:connectedStandardDebugAndroidTest

      # ✅ Signiertes Stable-Release bauen und veröffentlichen: release_github
      # mit tag: baut im Stable-Pfad BEIDE Flavor-APKs (assembleRelease +
      # assembleFossRelease), generiert SHA256SUMS und erstellt/repariert das
      # GitHub-Release idempotent (siehe fastlane/Fastfile publish_release).
      # Das Sentry-Gradle-Plugin lädt das ProGuard-Mapping automatisch hoch.
      - name: Build and publish stable release
        if: env.TAG != ''
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: privat-jb
          SENTRY_PROJECT: vivid
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec fastlane release_github tag:"$TAG"

      # ✅ Sigstore/cosign keyless-Signatur der SHA256SUMS.txt (seit 10.09.2026):
      # Nach dem Publish wird die veröffentlichte Checksummen-Datei signiert
      # (cert/Transparency-Log via ambient OIDC-Token des Runners — kein
      # langfristiges Key-Material im Repo) und als SHA256SUMS.txt.bundle an
      # dasselbe Release angehängt (--clobber macht den Schritt idempotent,
      # damit auch unvollständig veröffentlichte Releases reparierbar bleiben).
      # cosign v3: sign-blob schreibt standardmäßig ein Sigstore-Bundle
      # (Signatur + Zertifikat + Rekor-Eintrag in einer Datei) —
      # --output-signature/--output-certificate sind deprecated.
      # Verifikation durch Nutzer: cosign verify-blob --bundle
      # SHA256SUMS.txt.bundle SHA256SUMS.txt
      - name: Install cosign
        if: env.TAG != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # cosign v3 (Bundle-Default): sign-blob schreibt ein selbst-
          # kontainiertes Bundle (Signatur + Zertifikat + Rekor-Eintrag).
          # Die .sig/.crt-Assets sind eingestellt; die Verifikation läuft
          # über `cosign verify-blob --bundle SHA256SUMS.txt.bundle` —
          # dokumentiert in docs/distribution.md.
          cosign-release: 'v3.1.3'

      - name: Sign SHA256SUMS and attach signature to release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh leitet das Repository normal aus dem git-remote ab — dieser
          # Step läuft aber in $RUNNER_TEMP (außerhalb des Workspaces) und
          # scheitert dort mit "failed to run git: fatal: not a git repository"
          # (Run 35496094329). GH_REPO macht alle gh-Aufrufe cwd-unabhängig.
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/cosign"
          cd "$RUNNER_TEMP/cosign"
          gh release download "$TAG" -p SHA256SUMS.txt --dir . --clobber
          cosign sign-blob SHA256SUMS.txt --bundle SHA256SUMS.txt.bundle --yes
          gh release upload "$TAG" SHA256SUMS.txt.bundle --clobber
          echo "✅ cosign keyless-Bundle für $TAG hochgeladen"

      # ✅ CHANGELOG.md aus den GitHub-Releases spiegeln — kopiert aus
      # release-pipeline.yml (publish-release-Job, "Update CHANGELOG.md"):
      # Releases, die per `gh release create` mit GITHUB_TOKEN erstellt werden,
      # feuern KEIN `release: published`-Event (dokumentierte GITHUB_TOKEN-
      # Limitation gegen rekursive Workflow-Läufe). Der Update läuft deshalb
      # hier direkt nach der Veröffentlichung; der Bot-Commit (github-actions[bot])
      # wird vom Job-Guard oben übersprungen → keine Endlosschleife.
      - name: Update CHANGELOG.md from GitHub releases
        if: env.TAG != ''
        env:
          # Root-Fix CI-Suppression (Vorfall PRs #142/#143): Push + PR-Open
          # müssen per USER-Credential laufen (AUTOMATION_TOKEN) — sonst
          # unterdrückt GitHub die pull_request-Workflows auf dem Bot-PR und
          # die Pflicht-Checks (Build & Test, Secret Guard) laufen nie.
          # Fallback: GITHUB_TOKEN (altes Verhalten, mit ::warning::-Hinweis).
          # Bewusst NUR hier scoped (git remote set-url) — der Rest des Jobs
          # bleibt beim Checkout-Token.
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN != '' }}
        run: |
          git fetch origin develop
          git checkout -B changelog-update origin/develop
          bash scripts/update_changelog.sh
          if git diff --quiet CHANGELOG.md; then
            echo "CHANGELOG.md unverändert — nichts zu committen"
            exit 0
          fi
          # Branch Protection verbietet direkte Bot-Pushes auf develop →
          # Branch mit Zeitstempel + PR; gemergt wird manuell.
          BRANCH="chore/changelog-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: Update CHANGELOG from GitHub releases"
          # Rebase-Härtung: Während dieses Runs gemergte develop-Commits
          # (v. a. andere Bot-PRs, die dieselben CHANGELOG-Zeilen ändern)
          # lassen den PR sonst als CONFLICTING zurück (Vorfall #149).
          git fetch origin develop
          if ! git merge-base --is-ancestor "HEAD~1" origin/develop; then
            echo "::notice::develop ist während des Runs weitergelaufen — Rebase auf $(git rev-parse --short origin/develop)"
            if ! git rebase origin/develop; then
              echo "::warning::Rebase-Konflikt — CHANGELOG wird auf dem neuen develop neu generiert"
              git rebase --abort
              git reset --hard origin/develop
              bash scripts/update_changelog.sh
              git add CHANGELOG.md
              if git diff --cached --quiet; then
                echo "Nach Neugenerierung: keine Änderungen mehr — kein PR nötig"
                exit 0
              fi
              git commit -m "docs: Update CHANGELOG from GitHub releases"
            fi
          fi
          if [ "$HAS_AUTOMATION_TOKEN" != "true" ]; then
            echo "::warning::AUTOMATION_TOKEN ist nicht gesetzt — Bot-PR entsteht per GITHUB_TOKEN-Fallback. GitHub unterdrückt dann die Pflicht-Checks (Build & Test, Secret Guard) auf diesem PR (Rekursions-Schutz). Einmalig anlegen: gh secret set AUTOMATION_TOKEN --body <PAT> — Fine-grained PAT mit Contents+Pull requests (RW) auf dieses Repo."
          fi
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin "$BRANCH"
          PR_RESPONSE_FILE=$(mktemp)
          if ! gh api repos/${{ github.repository }}/pulls -f title="docs: Update CHANGELOG from GitHub releases" -f head="$BRANCH" -f base=develop -F body="Automatische CHANGELOG-Spiegelung nach wöchentlicher Stable-Veröffentlichung. Zum Übernehmen mergen (erforderliche Checks laufen im PR)." > "$PR_RESPONSE_FILE"; then
            echo "::error::PR-Create fehlgeschlagen — Rollback: Bot-Branch $BRANCH wird gelöscht (kein Orphan)"
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH" \
              || echo "::warning::Branch-Rollback fehlgeschlagen — manuell löschen: gh api -X DELETE repos/${{ github.repository }}/git/refs/heads/$BRANCH"
            exit 1
          fi
          PR=$(jq -r '.number' "$PR_RESPONSE_FILE")
          echo "$PR" > "$GITHUB_WORKSPACE/.pr_number"
          rm -f "$PR_RESPONSE_FILE"
          echo "✅ Bot-PR #$PR erstellt ($BRANCH) — Auto-Merge folgt (separater Step)"

      # Vollautomatischer Merge (Muster: automation-pypi-drift.yml, W12): Nach
      # dem REST-Create pollt der Workflow die beiden Pflicht-Checks (Build &
      # Test, Secret Guard) und merged bei Grün per REST-Squash — mit
      # Admin-Override (enforce_admins ist false in der Branch-Protection; die
      # 1-Review-Pflicht kann ein Bot-PR nie selbst erfüllen, da der Author
      # sich nicht selbst approven kann). Fail-soft: Checks rot oder Timeout
      # → PR bleibt offen (kein Rollback nach Create — der PR ist dann das
      # Review-Artefakt für manuelles Eingreifen). Der Branch wird nach
      # Merge von delete_branch_on_merge automatisch entfernt.
      - name: Auto-merge (checks green → squash)
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [ "$HAS_AUTOMATION_TOKEN" != "true" ]; then
            echo "::warning::Kein AUTOMATION_TOKEN — Auto-Merge übersprungen (die Pflicht-Checks wären auf dem Bot-PR unterdrückt)"
            exit 0
          fi
          if [ ! -f "$GITHUB_WORKSPACE/.pr_number" ]; then
            echo "Kein Bot-PR erstellt (Changelog unverändert) — Auto-Merge übersprungen"
            exit 0
          fi
          PR=$(cat "$GITHUB_WORKSPACE/.pr_number")
          SHA=$(git rev-parse HEAD)
          echo "Warte bis zu 30 min auf grüne Pflicht-Checks (Build & Test, Secret Guard)…"
          while true; do
            CONCL=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs"\
              --jq '[.check_runs[] | select(.name == "Build & Test" or .name == "Secret Guard") | .conclusion] | join(",")')
            SUCC=$(echo "$CONCL" | tr ',' '\n' | grep -c '^success$' || true)
            if [ "$SUCC" = "2" ]; then
              echo "Beide Pflicht-Checks grün ($CONCL) — Merge…"
              break
            fi
            if echo "$CONCL" | grep -qE 'failure|timed_out|cancelled|action_required|startup_failure'; then
              echo "::error::Pflicht-Checks fehlgeschlagen ($CONCL) — PR #$PR bleibt offen für manuelle Analyse"
              exit 1
            fi
            if [ "$SECONDS" -ge 1800 ]; then
              echo "::error::Timeout nach 30 min ohne grüne Checks ($CONCL) — PR #$PR bleibt offen"
              exit 1
            fi
            sleep 60
          done
          if gh api -X PUT "repos/${{ github.repository }}/pulls/$PR/merge"\
               -f merge_method=squash\
               -f commit_title="docs: Update CHANGELOG from GitHub releases (#$PR)"\
               --include; then
            echo "✅ Bot-PR #$PR automatisch gemerged (squash); Branch-Löschung übernimmt delete_branch_on_merge"
          else
            echo "::error::Merge-API fehlgeschlagen (Konflikt mit frischem develop-Merge oder Override verweigert) — PR #$PR bleibt offen"
            exit 1
          fi
