name: Security / CodeQL

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  schedule:
    # Wöchentlich Mo 04:00 UTC — Default-Branch-Scan unabhängig von PRs.
    - cron: "0 4 * * 1"

# Least privilege: Lesen für den Checkout, Schreiben nur für Security-Events.
permissions:
  contents: read
  security-events: write

# Ein aktiver Lauf pro Branch/PR — bei Re-Push wird der alte abgebrochen.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (Kotlin/Java)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        language: [ java-kotlin ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      # SHA-Pins (Supply-Chain), konsistent mit der CI-Härtung in RELEASE.md:
      # Alle drei Actions stammen aus demselben Release-Tag v4.37.8.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@37f2634a92ba38a0926ef79a0748ac8ae7d95ab2 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          # Security-relevante Query-Pakete zusätzlich zum Standard.
          queries: security-extended,security-and-quality

      # Manueller statt Autobuild: deterministisch kt-Kompilierung des App-Moduls
      # (CodeQL traced die Build-Schritte für Datenfluss-Analyse).
      - name: Build Debug APK (CodeQL trace)
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@37f2634a92ba38a0926ef79a0748ac8ae7d95ab2 # v4.37.8
        with:
          category: "/language:${{ matrix.language }}"