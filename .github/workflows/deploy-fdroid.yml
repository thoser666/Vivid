name: Deploy / F-Droid

on:
  # Trigger on new releases
  release:
    types: [published]
  
  # Weekly update check
  schedule:
    - cron: '0 4 * * 1'
  
  # Manual trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., v0.5.7-beta)'
        required: false
        default: 'latest'

# Only one run at a time
concurrency:
  group: fdroid-repo
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-repo:
    name: Build F-Droid Repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      
      - name: Install fdroidserver
        run: pip install fdroidserver
      
      - name: Determine version to build
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.version }}" != "latest" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download last 5 release APKs
        run: |
          cd fdroid
          mkdir -p repo
          
          # Download the 5 most recent release APKs
          # Each release's APK is named app-release.apk, so we prefix with the
          # tag name to keep filenames unique in the shared repo/ directory.
          i=0
          for TAG in $(gh release list --limit 5 --json tagName -q '.[].tagName'); do
            i=$((i + 1))
            TMP="/tmp/apk_$i"
            mkdir -p "$TMP"
            gh release download "$TAG" \
              --pattern "*.apk" \
              --pattern "*-unsigned.apk" \
              --dir "$TMP/" \
              --skip-existing || true
            for f in "$TMP"/*.apk; do
              [ -e "$f" ] || continue
              cp "$f" "repo/${TAG}_$(basename "$f")"
            done
          done
          
          echo "Downloaded APKs:"
          ls -la repo/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build F-Droid repository
        env:
          F_DROID_KEYSTORE: ${{ secrets.F_DROID_KEYSTORE }}
          F_DROID_KEY_ALIAS: ${{ secrets.F_DROID_KEY_ALIAS }}
          F_DROID_KEY_PASSWORD: ${{ secrets.F_DROID_KEY_PASSWORD }}
          F_DROID_KEY_DNAME: ${{ secrets.F_DROID_KEY_DNAME }}
        run: |
          cd fdroid
          
          # Decode keystore from secret
          echo "$F_DROID_KEYSTORE" | base64 -d > keystore.p12
          
          # Create config with signing key
          cat > config.yml << EOF
          builds_dir: repo
          repo_url: https://thoser666.github.io/Vivid/fdroid/repo
          repo_name: Vivid
          repo_description: "Vivid - Open Source IRL Streaming App with Chat Bot & AI Features"
          repo_icon: icon.png
          # Keep all downloaded versions in the main repo (no archiving):
          # the last 5 release APKs are freshly downloaded on every run.
          archive_older: 0
          keystorepass: ${F_DROID_KEY_PASSWORD}
          keypass: ${F_DROID_KEY_PASSWORD}
          repo_keyalias: ${F_DROID_KEY_ALIAS}
          keydname: ${F_DROID_KEY_DNAME}
          EOF
          
          # Create metadata directory and YAML file for the app
          mkdir -p metadata
          cat > metadata/com.vivid.yml << 'EOF'
          Categories:
            - Internet
            - Entertainment
            - Multimedia
          License: MIT
          AutoName: Vivid
          Summary: Open source IRL streaming app with chat bot and AI features
          Description: |-
            <p>Vivid is an open-source IRL streaming application for Android.</p>
            <p><b>Features:</b></p>
            <ul>
              <li>Live streaming via RTMP/SRT to Twitch, YouTube, Kick, and custom platforms</li>
              <li>Real-time chat overlay with badges and emotes</li>
              <li>AI-powered chat bot with configurable responses</li>
              <li>Owner remote control commands</li>
              <li>Dark mode with AMOLED support</li>
              <li>Multi-language support (English, German, French)</li>
              <li>Scene management and auto-switching</li>
              <li>Real-time GPS overlay (altitude, speed, coordinates)</li>
              <li>Custom RTMP/SRT endpoints</li>
            </ul>
            <p><a href="https://github.com/thoser666/Vivid">Source Code</a> | <a href="https://github.com/thoser666/Vivid/issues">Bug Reports</a></p>
          WebSite: https://thoser666.github.io/Vivid/
          SourceCode: https://github.com/thoser666/Vivid
          IssueTracker: https://github.com/thoser666/Vivid/issues
          Donate: https://github.com/sponsors/thoser666
          Changelog: https://github.com/thoser666/Vivid/releases
          EOF
          
          # Generate repo index (fdroid reads metadata from YAML files automatically)
          fdroid update -v
          
          # Verify repository was created
          if [ ! -f "repo/index.xml" ]; then
            echo "Error: Repository index.xml not created"
            exit 1
          fi
          
          echo "Repository built successfully"
          ls -la repo/
          
          # Cleanup keystore
          rm -f keystore.p12
      
      - name: Copy to docs/fdroid
        run: |
          # Ensure docs/fdroid/repo exists
          rm -rf docs/fdroid
          mkdir -p docs/fdroid
          
          # Copy repo files
          cp -r fdroid/repo docs/fdroid/
          
          # Copy QR code
          cp docs/fdroid-repo-qr.svg docs/fdroid/qr.svg
          
          # Verify
          echo "Files in docs/fdroid:"
          ls -la docs/fdroid/
          echo ""
          echo "Files in docs/fdroid/repo:"
          ls -la docs/fdroid/repo/
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check for new or changed files (git diff misses untracked dirs)
          git add docs/fdroid/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update F-Droid repository (last 5 versions)"
            git push
          fi
