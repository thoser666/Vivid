name: CI

on:
  push:
    branches: ["master", "develop"]
  pull_request:
    branches: ["master", "develop"]

permissions:
  contents: read

# Serialisiert: schnelle Push-Serien auf denselben Ref canceln fruehere,
# ueberholte Laeufe (CI-Minuten sparen); Release-Artefakt des neuesten
# Commits ist massgeblich. Bewusst eigener Namespace (nicht release-*):
# der Fastlane-Workflow serialisiert die Nightly-Publikation separat.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 0️⃣ Secret-Guard – verhindert, dass Keystores/Secrets ins Repo gelangen
  guard-secrets:
    name: Secret Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run secret guard
        run: bash scripts/guard_secrets.sh

      # I18n-Guard: verbietet hartkodierte UI-Strings (Externalisierungs-Gate),
      # prüft values/ ↔ values-en/ Vollständigkeit pro Modul und sichert die
      # stream_url_hint-Kernaussagen (RTMP/SRT/Owncast/Presets) in beiden
      # Sprachen — siehe docs/i18n-plan.md §5.
      - name: Check i18n
        run: bash scripts/check_i18n.sh

      - name: Test i18n guard
        run: bash scripts/test_check_i18n.sh

  # 1️⃣ Build & Test
  build:
    name: Build & Test
    needs: guard-secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      # ── Sentry‑Konfiguration (nur die wichtigsten) ──
      SENTRY_ORG: privat-jb
      SENTRY_PROJECT: vivid
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Vollständige Historie: der PARITY-Log-Guard prüft mit
          # --check-exists, dass referenzierte Hashes existieren und Vorfahren
          # von HEAD sind — im Default-Shallow-Checkout (fetch-depth: 1)
          # fehlen die historischen Objekte lokal.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant executable permission to gradlew
        run: chmod +x ./gradlew

      # Debug-Variante deckt alle Module ab (app, core, data, domain, feature-*);
      # Tests liegen in src/test — keine Release-Varianten-Tests im Projekt.
      - name: Run unit tests (all modules)
        run: ./gradlew testDebugUnitTest

      - name: Run lint & static analysis
        run: ./gradlew lintDebug

      # Changelog-Generator (bash) — deterministischer Test ohne Netzwerk (Fake-gh)
      - name: Test changelog script
        run: bash scripts/test_update_changelog.sh

      # Pre-Push-Gate (bash) — Dry-Run: alle Checks müssen aufgelistet sein
      - name: Test pre-push gate script
        run: bash scripts/test_pre_push.sh

      # Sentry-Opt-out-Mapping-Check (bash) — Selbsttest mit Stub-Mapping:
      # beweist, dass der Check die inlined Opt-out-Logik im R8-Mapping findet
      # (1 Positiv- + 6 Negativfälle, offline/deterministisch).
      - name: Test sentry optout mapping check
        run: bash scripts/test_sentry_optout_mapping.sh

      # Play-Metadaten-Check (bash) — Selbsttest mit Fixture-PNGs: 1 Positiv-
      # + 5 Negativfälle. Der harte Gate-Check läuft im publish-play-Job
      # (release-pipeline.yml) direkt vor dem Upload.
      - name: Test play metadata check
        run: bash scripts/test_play_metadata.sh

      # Fastfile-Suffix-Guard (Ruby) — Selbsttest: beweist, dass release_alpha/
      # release_beta bei explizitem version: OHNE Stufen-Suffix abbrechen
      # (der v0.5.1-Vorfall vom 18.08.2026) und dass beide Lanes den Guard
      # aufrufen. Offline, kein fastlane nötig.
      - name: Test fastlane stage-suffix guard
        run: bash scripts/test_stage_suffix_guard.sh

      # Markdown-Anker-Check (Python) — Selbsttest mit Fixtures (3 Positiv- +
      # 5 Negativfälle: toter Anker same-file/cross-file, fehlende Ziel-Datei
      # inkl. Nicht-md-Bilder/SVGs, Umlaut-/Variation-Selector-Header) +
      # GitHub-Golden-Test (14 empirisch von GitHub verifizierte Anker-IDs) +
      # Real-Check des Repos: tote Anker nach Abschnitts-Umbenennungen und
      # kaputte Datei-/Bild-Links brechen die CI statt still zu 404en.
      - name: Test markdown anchor check
        run: bash scripts/test_markdown_anchors.sh

      # GitHub-Golden-Test: beweist OFFLINE, dass die Anker-Berechnung exakt
      # dem GitHub-Rendering entspricht (scripts/github_anchors_golden.tsv,
      # IDs aus gerenderten Seiten extrahiert — kein Netzwerk nötig).
      - name: Test GitHub anchor golden file
        run: bash scripts/test_github_anchors.sh

      - name: Check markdown anchors
        run: bash scripts/check_markdown_anchors.sh

      # PARITY-Log-Guard (Python) — Selbsttest mit Fixtures (sauberer Log grün,
      # Platzhalter „—"/ungültige Hashes rot, Header-/Trenner-Zeilen ignoriert,
      # Backtick-Hashes ok) + Real-Check: jeder Aktualisierungslog-Eintrag in
      # PARITY.md muss einen gültigen 7-Zeichen-Commit-Hash tragen, damit der
      # Log nachvollziehbar bleibt (Vorfall 2026-08-20: I18n-Eintrag war „—").
      # Der Real-Check läuft mit --check-exists: der Hash muss zusätzlich
      # existieren und Vorfahre von HEAD sein (fängt Rebase-Orphans wie
      # c0fb445 → 7ae806a vom 2026-08-21) — dafür braucht der Build-Job
      # vollständige Historie (fetch-depth: 0).
      - name: Test parity log guard
        run: bash scripts/test_parity_log.sh

      - name: Check parity log
        run: bash scripts/check_parity_log.sh --check-exists

      # Version-Catalog-Consistency: prüft, dass alle Artefakte desselben
      # Maven-Groups denselben version.ref verwenden (keine vergessenen
      # Version-Keys, die beim B-Update zu inkonsistenten Versionen führen).
      - name: Test version catalog consistency
        run: bash scripts/test_check_version_catalog.sh

      - name: Check version catalog consistency
        run: bash scripts/check_version_catalog.sh

      # Geteilte Release-Safety (Ruby) — Selbsttest: versionCode-Ableitung,
      # Track-Monotonie (kein Downgrade) und Quer-Track-Vergleich; strukturell
      # wird geprüft, dass release_alpha UND release_beta dieselben Funktionen
      # nutzen (kein Auseinanderlaufen der Lanes mehr).
      - name: Test fastlane release-safety
        run: bash scripts/test_release_safety.sh

      # Roadmap-Reservierung (Ruby) — Selbsttest: v0.6.0-beta wird abgelehnt,
      # solange das Streaming-Erweiterungs-Bucket (RIST/WHIP/RTMP-Pull/4K-HEVC/
      # SRTLA) in PARITY.md nicht vollständig ✅ ist (RELEASE.md → Roadmap →
      # Nummerierung); erlaubt sobald das Bucket implementiert ist.
      - name: Test fastlane roadmap reservation guard
        run: bash scripts/test_roadmap_reservation.sh

      # ── Optional: Code‑Scanning / Security‑Events ──
      # - name: Run CodeQL
      #   uses: github/codeql-action/init@v2
      #   with:
      #     languages: java

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**

  # 2️⃣ Release (nur auf `master` bzw. wenn der PR auf `master` gemergt wird)
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build          # wartet auf den erfolgreichen Build‑Job
    if: (github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]' && !contains(github.event.commits.*.author.username, 'dependabot[bot]')
    permissions:
      contents: read

    env:
      SENTRY_ORG: privat-jb
      SENTRY_PROJECT: vivid
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # ── Keystore dekodieren (KEYSTORE_* Secrets, identisch zum fastlane-Workflow) ──
      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -di > ${{ github.workspace }}/release.keystore
          echo "KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> "$GITHUB_ENV"

      # ── Release Build (signiert) — Signing-Env-Vars liest app/build.gradle.kts ──
      - name: Assemble signed release APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      # ── Artifact‑Upload ──
      - name: Upload APK as artifact
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 5
