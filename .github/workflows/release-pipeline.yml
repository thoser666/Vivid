name: Release Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  # Nightly-Build NUR einmal pro Tag (06:00 UTC) + manuell: der Nightly-
  # Publish läuft NICHT bei jedem develop-Push (seit 21.08.2026 — vorher
  # entstand pro Push ein neues Nightly; die tägliche Kadenz hält Obtainium-
  # Updates stabil und spart CI-Ressourcen). Schedule-Runs laufen auf dem
  # Default-Branch (develop) — GitHub setzt github.ref dabei auf
  # refs/heads/develop.
  schedule:
    - cron: '0 6 * * *'
  # Manuell auslösbar (z. B. zum Testen des Schedule-Pfads):
  # gh workflow run release-pipeline.yml --ref develop
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 1.2.3); default: last git tag'
        required: false
        type: string
      version_code:
        description: 'Version code; default: derived from version name'
        required: false
        type: string
      track:
        description: 'Google Play track (alpha/beta/internal/production)'
        required: false
        default: 'alpha'
        type: string
      dry_run:
        description: 'Build + signature-verify only, skip the Play upload'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

# Serialisiert die nightly-Publikation: zwei schnelle develop-Pushes dürfen
# sich nicht um den rollierenden "nightly"-Tag streiten.
# cancel-in-progress: false ist BEWUSST: Der laufende Run muss seine
# Veröffentlichung (Tag-Push → Release → CHANGELOG → Verify) immer zu Ende
# bringen — ein Abbruch mitten in der Kette hinterlässt Orphan-Tags/halb
# erstellte Releases (siehe Orphan-Sweep im Fastfile). Queued Runs (noch ohne
# gestarteten Job) cancelt GitHub automatisch, sobald ein neuerer Push für
# denselben Ref eintrifft — die Queue staut sich also nie, und nur der
# in-flight Run wird geschützt.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25 (LTS)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ✅ Tests laufen OHNE Signing-Secrets
      - name: Run unit tests
        run: bundle exec fastlane test

      # ✅ Lint & Static Analysis auf ALLEN Modulen — gleicher Standard wie
      # android-ci.yml (warningsAsErrors in allen Modulen gesetzt). blockt, sobald
      # eine Warnung/Fehler auftaucht; Build-Release/ Publish hängen an diesem Job.
      - name: Run lint & static analysis
        run: bundle exec fastlane lint

      # ✅ Live-Check des UpdateCheckers gegen die ECHTEN GitHub-Releases des Repos
      # (kein Mock): parsebare Versions-Antwort, konsistente Cross-Track-Logik.
      # Bewusst als eigener Schritt, damit GH_TOKEN (authentifiziert, hohes
      # Rate-Limit) genutzt wird — unauthentifiziert teilen sich Runner-IPs die
      # 60 Requests/h. Der Test selbst ist per @EnabledIfSystemProperty deaktiviert
      # und wird NUR hier mit -PliveUpdateCheck=true aktiviert.
      - name: Live update check against GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :core:testDebugUnitTest --tests "com.vivid.core.update.LiveUpdateCheckTest" -PliveUpdateCheck=true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'

  # ✅ Instrumentierte UI-Tests (androidTest) auf einem echten Emulator:
  #   - HelpNavigationTest  → beide Help-Einstiege (Streaming-❓ + About) +
  #                          externer Doku-Link (ACTION_VIEW-Intent)
  #   - PlayScreenshotsTest → Play-Screenshots per fastlane screengrab
  # Läuft manuell (workflow_dispatch) per Matrix auf beiden Runner-Architekturen.
  # Nutzt die Community-Action
  # reactivecircus/android-emulator-runner (v2.38.0, SHA-gepinnt), die AVD-Erstellung,
  # Boot und Script-Ausführung übernimmt.
  # Keine Signing-Secrets nötig — Debug-Build mit Debug-Key.
  #
  # Locale-Matrix (en-US, de-DE): beweist dauerhaft, dass die Suite locale-robust
  # ist (die Help-Tests lösen Strings über die R-Klassen auf).  Die Emulator-Locale
  # wird über den Settings-Store gesetzt (`settings put system system_locales`)
  # und per `adb reboot` wirksam — der Emulator akzeptiert seit neueren Versionen
  # nur noch `qemu.*`-Properties, `-prop persist.sys.locale` wird ignoriert.
  # Der Locale-Proof prüft danach die EFFEKTIVE Geräte-Konfiguration
  # (`cmd activity get-config`) — schlägt er fehl, bricht der Job ab, damit nie
  # fälschlich ein „locale-robust“-Grün gemeldet wird.
  emulator-tests:
    name: Instrumented UI Tests (${{ matrix.name }})
    # Nur manuell per workflow_dispatch lauffähig. Matrix (Vorfall 06.09.2026,
    # Run 34009482168: Job lief allein auf macos-latest/arm64 und crashte beim
    # Emulator-Boot mit `qemu-system-aarch64: failed to initialize HVF:
    # HV_UNSUPPORTED`):
    #   - ubuntu-x86_64: authority-fähig — GitHub-hosted Linux-Runner bieten
    #     KVM für Android-Workloads (Changelog 02.04.2024); der udev-perms-Step
    #     ist Pflicht, sonst fällt der Emulator auf -accel off zurück
    #     (Boot-Timeout — die früheren Linux-Fehlschläge ohne einen Testfehler).
    #   - macos-arm64: experimentell (continue-on-error) — HVF auf den Arm64-
    #     Images derzeit HV_UNSUPPORTED; sobald das Image wieder bootet,
    #     meldet sich die Leg von selbst grün.
    if: github.event_name == 'workflow_dispatch'
    needs: test
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-x86_64
            os: ubuntu-latest
            arch: x86_64
            experimental: false
          - name: macos-arm64
            os: macos-latest
            arch: arm64-v8a
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25 (LTS)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      # ✅ KVM für Android-Workloads freischalten (GitHub-Changelog 02.04.2024):
      # ohne diese udev-Regel ist /dev/kvm nicht beschreibbar und der Emulator
      # fällt auf Software-Acceleration zurück (-accel off → Boot-Timeout).
      - name: Enable KVM group perms
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ✅ Accel-Diagnostik: Nachweis, dass KVM wirklich nutzbar ist — schlägt
      # das fehl, scheitert der Job hier statt im Boot-Timeout (klare Ursache).
      - name: Verify KVM acceleration available
        if: runner.os == 'Linux'
        run: |
          if [ -e /dev/kvm ]; then
            echo "✅ /dev/kvm vorhanden"
            if [ ! -w /dev/kvm ]; then
              echo "::error::/dev/kvm nicht beschreibbar — udev-Regel greift nicht"
              exit 1
            fi
            echo "✅ /dev/kvm beschreibbar (KVM-Hardware-Acceleration aktiv)"
          else
            echo "::error::/dev/kvm fehlt — Emulator würde auf -accel off laufen (Boot-Timeout)"
            exit 1
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ✅ Emulator hochfahren + alle instrumentierten Tests ausführen
      # (Debug-Build, wird von connectedDebugAndroidTest gebaut).
      # Bewusst nur en-US: Ein zweiter Locale-Lauf (de-DE) wurde zurückgenommen —
      # der Locale-Wechsel per Settings-Store wirkt auf API-34-Emulatoren in der
      # CI nicht (AM-Config bleibt en-US), adb reboot / stop-start lassen das
      # Gerät offline hängen. Die Tests sind per R-Klassen/getString()
      # locale-robust (erwarteter == gerenderter String aus derselben Ressource).
      - name: Run instrumented tests on emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: ${{ matrix.arch }}
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: 900
          script: |
            ./gradlew :app:connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-test-results-${{ matrix.name }}
          path: '**/build/outputs/androidTest-results/**/*.xml'

  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25 (LTS)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ✅ Debug-Build braucht KEINE Signing-Secrets
      - name: Build Debug APK
        run: bundle exec fastlane build_debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: test
    # ✅ Nur auf main-Branch, kein Dependabot (auch nicht per manuellem Merge)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]' && !contains(github.event.commits.*.author.username, 'dependabot[bot]')

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25 (LTS)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ✅ Keystore dekodieren (wenn vorhanden)
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Härtung: Ohne Release-Keystore KEIN Release bauen/veröffentlichen —
          # ein mit dem Debug-Key signiertes APK würde Obtainium-Updates brechen
          # (andere Signatur). Stattdessen laut fehlschlagen.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 fehlt — Release müsste mit Debug-Key signiert werden. Abbruch."
            exit 1
          fi
          echo $KEYSTORE_BASE64 | base64 -di > ${{ github.workspace }}/release.keystore
          echo "KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV

      # ✅ Release-Build mit Signing-Secrets
      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: bundle exec fastlane build_release

      - name: Upload Release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-release
          # Flavor-Pfad: die App hat die Flavors standard/foss — assembleRelease
          # schreibt nach apk/standard/release/ mit flavor-Dateinamen.
          path: app/build/outputs/apk/standard/release/app-standard-release.apk

  # ✅ GitHub-Release veröffentlichen:
  #   - Nightly (develop) → rollierendes nightly-Prerelease, NUR einmal pro Tag
  #     (Schedule 06:00 UTC + manuell per workflow_dispatch) — NICHT bei
  #     jedem develop-Push, damit die Nightly-Kadenz stabil bleibt.
  #   - Stable (v*-Tags) → wird seit 10.09.2026 NICHT mehr hier publiziert:
  #     die wöchentliche Stable-Publikation übernimmt der eigene Workflow
  #     distribution-stable.yml (Mo 03:00 UTC + manuell, siehe docs/distribution.md).
  #     Grund: GitHub unterscheidet nicht, welcher Cron einen Schedule-Run
  #     ausgelöst hat — ein zusätzlicher Cron hier hätte Stable fälschlich
  #     täglich publiziert. Der v*-Tag-Push baut/tests weiterhin, veröffent-
  #     licht aber nicht mehr; der Weekly-Job sucht die neueste noch nicht
  #     (vollständig) verteilte Version und veröffentlicht genau diese.
  # Baut bewusst selbst (nicht needs: build-release), weil der Job bei Tag-Push
  # übersprungen würde und GitHub Actions abhängige Jobs dann ebenfalls skippt.
  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: test
    # Kein Release für: Dependabot (auch per manuellem Merge) und die
    # Changelog-Bot-Commits (Loop-Schutz: docs: Update CHANGELOG … darf
    # kein neues Nightly auslösen — Tests/Build laufen trotzdem).
    # Nur Schedule/Manual: der Stable-Pfad (v*-Tags) läuft im Workflow
    # distribution-stable.yml — hier gibt es keinen Push-Publizier-Pfad mehr
    # (Push auf develop darf KEIN Nightly auslösen; v*-Tags publiziert der
    # Weekly-Job).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Bewusst KEIN `workflows: write`: Push-getriggerte Workflows, die dem
    # GITHUB_TOKEN diese Berechtigung geben, scheitern bei der Validierung
    # ("This run likely failed because of a workflow file issue" — Schutz vor
    # Token-Eskalation). Der nightly-Tag zeigt stattdessen immer auf den
    # aktuellen develop-HEAD (siehe Fastfile) → kein Workflow-Diff → keine
    # workflows-Berechtigung nötig.
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Volle Historie für git describe --tags (Versionableitung im Fastfile)
          fetch-depth: 0

      - name: Set up JDK 25 (LTS)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ✅ Keystore dekodieren (wenn vorhanden)
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Härtung: Ohne Release-Keystore KEIN Release bauen/veröffentlichen —
          # ein mit dem Debug-Key signiertes APK würde Obtainium-Updates brechen
          # (andere Signatur). Stattdessen laut fehlschlagen.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 fehlt — Release müsste mit Debug-Key signiert werden. Abbruch."
            exit 1
          fi
          echo $KEYSTORE_BASE64 | base64 -di > ${{ github.workspace }}/release.keystore
          echo "KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV

      # ✅ Signiertes APK bauen und als GitHub-Release veröffentlichen (stable oder nightly)
      # Das Sentry-Gradle-Plugin lädt das ProGuard-Mapping automatisch mit hoch
      # (SENTRY_AUTH_TOKEN/ORG/PROJECT unten) — kein separates sentry-cli nötig.
      - name: Build and publish release
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: privat-jb
          SENTRY_PROJECT: vivid
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec fastlane release_github

      # ✅ CHANGELOG.md aus den GitHub-Releases spiegeln — bewusst im selben Job:
      # Releases, die per `gh release create` mit GITHUB_TOKEN erstellt werden,
      # feuern KEIN `release: published`-Event (dokumentierte GITHUB_TOKEN-
      # Limitation gegen rekursive Workflow-Läufe). Der Update läuft deshalb hier
      # direkt nach der Veröffentlichung. Der Bot-Commit (github-actions[bot])
      # wird vom Job-Guard oben übersprungen → keine Endlosschleife.
      - name: Update CHANGELOG.md from GitHub releases
        env:
          # Root-Fix CI-Suppression (Vorfall PRs #142/#143): Push + PR-Open
          # müssen per USER-Credential laufen (AUTOMATION_TOKEN) — sonst
          # unterdrückt GitHub die pull_request-Workflows auf dem Bot-PR und
          # die Pflicht-Checks (Build & Test, Secret Guard) laufen nie.
          # Fallback: GITHUB_TOKEN (altes Verhalten, mit ::warning::-Hinweis).
          # Bewusst NUR hier scoped (git remote set-url) — der Rest des Jobs
          # (Tag-Push, Release-Create) bleibt beim Checkout-Token.
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN != '' }}
        run: |
          git fetch origin develop
          git checkout -B changelog-update origin/develop
          bash scripts/update_changelog.sh
          if git diff --quiet CHANGELOG.md; then
            echo "CHANGELOG.md unverändert — nichts zu committen"
            exit 0
          fi
          # Branch Protection verbietet direkte Bot-Pushes auf develop →
          # Branch mit Zeitstempel + PR; gemergt wird manuell. (Der Loop-Guard
          # in release-pipeline.yml hängt am Commit-AUTHOR — bleibt
          # github-actions[bot], unabhängig vom Push-Credential.)
          BRANCH="chore/changelog-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: Update CHANGELOG from GitHub releases"
          # Rebase-Härtung: Während dieses Runs gemergte develop-Commits
          # (v. a. andere Bot-PRs, die dieselben CHANGELOG-Zeilen ändern)
          # lassen den PR sonst als CONFLICTING zurück (Vorfall #149).
          # HEAD~1 ist der develop-Stand vom Step-Start; origin/develop wird
          # frisch geholt — bewegt, wird der Commit rebaset. Konflikt →
          # abort + Neugenerierung auf dem neuen Stand (Skript ist idempotent
          # und liest Releases frisch von der API) — Konflikt ausgeschlossen.
          git fetch origin develop
          if ! git merge-base --is-ancestor "HEAD~1" origin/develop; then
            echo "::notice::develop ist während des Runs weitergelaufen — Rebase auf $(git rev-parse --short origin/develop)"
            if ! git rebase origin/develop; then
              echo "::warning::Rebase-Konflikt — CHANGELOG wird auf dem neuen develop neu generiert"
              git rebase --abort
              git reset --hard origin/develop
              bash scripts/update_changelog.sh
              git add CHANGELOG.md
              if git diff --cached --quiet; then
                echo "Nach Neugenerierung: keine Änderungen mehr — kein PR nötig"
                exit 0
              fi
              git commit -m "docs: Update CHANGELOG from GitHub releases"
            fi
          fi
          if [ "$HAS_AUTOMATION_TOKEN" != "true" ]; then
            echo "::warning::AUTOMATION_TOKEN ist nicht gesetzt — Bot-PR entsteht per GITHUB_TOKEN-Fallback. GitHub unterdrückt dann die Pflicht-Checks (Build & Test, Secret Guard) auf diesem PR (Rekursions-Schutz). Einmalig anlegen: gh secret set AUTOMATION_TOKEN --body <PAT> — Fine-grained PAT mit Contents+Pull requests (RW) auf dieses Repo."
          fi
          # User-Credential NUR für diesen Push aktivieren (kein Checkout-Wechsel):
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin "$BRANCH"
          # REST statt `gh pr create` (GraphQL createPullRequest): Fine-grained
          # PATs scheitern an der GraphQL-Mutation auch mit korrekter
          # Pull-requests-Permission — der REST-Endpoint funktioniert.
          # Rollback-Härtung: Scheitert der PR-Create, bleibt der bereits
          # gepushte Branch als Orphan zurück → Branch löschen, dann laut
          # abbrechen (siehe Orphan-Vorfall der Runs 34021546368/34022706363).
          if ! gh api repos/${{ github.repository }}/pulls -f title="docs: Update CHANGELOG from GitHub releases" -f head="$BRANCH" -f base=develop -F body="Automatische CHANGELOG-Spiegelung nach Release-Veröffentlichung. Zum Übernehmen mergen (erforderliche Checks laufen im PR)."; then
            echo "::error::PR-Create fehlgeschlagen — Rollback: Bot-Branch $BRANCH wird gelöscht (kein Orphan)"
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH" \
              || echo "::warning::Branch-Rollback fehlgeschlagen — manuell löschen: gh api -X DELETE repos/${{ github.repository }}/git/refs/heads/$BRANCH"
            exit 1
          fi
          echo "✅ Bot-PR erstellt ($BRANCH)"

  # ✅ Reproduzierbarkeits-Check: veröffentlichtes nightly-APK gegen einen frischen
  # Build desselben Commits vergleichen (Hash-Vergleich). Gleiche Parameter
  # (-PversionName/-PversionCode) + gleicher Keystore ⇒ bit-identische APK.
  verify-reproducibility:
    name: Verify Reproducibility (nightly)
    runs-on: ubuntu-latest
    needs: publish-release
    # Läuft nur nach dem (täglichen) nightly-Publish — Schedule/Manual,
    # nicht bei jedem develop-Push (dort wird seit 21.08. kein Nightly gebaut).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 25 (LTS)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ✅ Keystore dekodieren — gleicher Key ⇒ gleiche Signatur
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Härtung: Ohne Release-Keystore KEIN Release bauen/veröffentlichen —
          # ein mit dem Debug-Key signiertes APK würde Obtainium-Updates brechen
          # (andere Signatur). Stattdessen laut fehlschlagen.
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 fehlt — Release müsste mit Debug-Key signiert werden. Abbruch."
            exit 1
          fi
          echo $KEYSTORE_BASE64 | base64 -di > ${{ github.workspace }}/release.keystore
          echo "KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV

      # ✅ versionName/versionCode aus dem soeben veröffentlichten nightly-Release lesen
      # und das Artefakt herunterladen (Revision-Sanity gegen das Checkout).
      - name: Read published nightly and download APK
        id: nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LIST=$(gh release list --limit 5 --json tagName,name,isPrerelease --jq '.[] | select(.isPrerelease and (.tagName | startswith("nightly-")))')
          TAG=$(echo "$LIST" | head -1 | jq -r .tagName)
          TITLE=$(echo "$LIST" | head -1 | jq -r .name)
          if [ -z "$TAG" ] || [ -z "$TITLE" ]; then
            echo "::error::Kein nightly-Release gefunden"
            exit 1
          fi
          VERSION_NAME=$(echo "$TITLE" | sed -n 's/.*(\(.*\)).*/\1/p')
          VERSION_CODE=$(echo "$VERSION_NAME" | sed -n 's/.*nightly\.\([0-9]*\).*/\1/p')
          echo "release=$TITLE (tag=$TAG)"
          echo "version_name=$VERSION_NAME version_code=$VERSION_CODE"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          curl -sfL -o published.apk "$BASE/app-standard-release.apk" || { echo "::error::app-standard-release.apk fehlt im Release"; exit 1; }
          curl -sfL -o published-mapping.txt "$BASE/mapping.txt" || { echo "::error::mapping.txt fehlt im Release"; exit 1; }
          curl -sfL -o published-output-metadata.json "$BASE/output-metadata.json" || { echo "::error::output-metadata.json fehlt im Release"; exit 1; }
          # Optional: AAB herunterladen, falls die Release-Lane künftig zusätzlich
          # ein Bundle publiziert — sonst werden die AAB-Checks übersprungen.
          if curl -sfL -o published.aab "$BASE/app-standard-playRelease.aab"; then
            echo "aab_published=true" >> "$GITHUB_OUTPUT"
            echo "✅ AAB im Release gefunden"
          else
            echo "aab_published=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Kein AAB im Release — AAB-Signatur-/Reproduzierbarkeits-Checks übersprungen"
          fi
          REV=$(unzip -p published.apk META-INF/version-control-info.textproto 2>/dev/null | grep revision | sed 's/.*: "//;s/".*//')
          echo "embedded_revision=$REV (checkout=${{ github.sha }})"
          if [ -z "$VERSION_CODE" ] || [ "$REV" != "${{ github.sha }}" ]; then
            echo "::error::Version/Revision mismatch — falsches Release heruntergeladen?"
            exit 1
          fi

      # ✅ Signatur-Check: Das veröffentlichte Nightly-APK muss mit dem Release-Key
      # signiert sein (nicht mit dem Debug-Key — das würde Obtainium-Updates brechen).
      # Fingerprint des APK-Signers (apksigner) gegen das Zertifikat aus dem
      # dekodierten Keystore (keytool) vergleichen — als harter Fail, genau wie der
      # Hash-Vergleich unten.
      - name: Verify published APK signature against release key
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APKSIGNER=$(command -v apksigner || ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner nicht gefunden (Android build-tools fehlen)"
            exit 1
          fi
          # Roh-Ausgabe für Diagnose loggen, dann robust extrahieren (Format-/Versionstolerant:
          # grep nach der SHA-256-Zeile statt festem Zeilenpräfix).
          CERT_OUT=$("$APKSIGNER" verify --print-certs published.apk 2>&1)
          echo "--- apksigner verify output ---"
          echo "$CERT_OUT"
          APK_FP=$(echo "$CERT_OUT" | grep -i 'SHA-256 digest' | head -1 | sed 's/.*digest[[:space:]]*:[[:space:]]*//I' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          # Zertifikat-Fingerprint aus dem Release-Keystore (keytool: UPPERCASE mit Doppelpunkten)
          KEY_FP=$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | grep '^[[:space:]]*SHA256:' | sed 's/.*SHA256:[[:space:]]*//' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ -z "$APK_FP" ] || [ -z "$KEY_FP" ]; then
            echo "::error::Fingerprint nicht ermittelbar (APK='$APK_FP' Key='$KEY_FP') — Signatur-Check abgebrochen"
            exit 1
          fi
          echo "APK Signer SHA-256: $APK_FP"
          echo "Key SHA-256:       $KEY_FP"
          if [ "$APK_FP" != "$KEY_FP" ]; then
            echo "::error::Signatur-Mismatch — veröffentlichtes APK ist NICHT mit dem Release-Key signiert!"
            exit 1
          fi
          echo "✅ Signatur verifiziert: veröffentlichtes Nightly-APK trägt den Release-Key"

      # ✅ AAB-Signatur-Check (falls die Release-Lane ein Bundle mitpubliziert):
      # AABs sind JAR-signiert (v1) — Integrität per jarsigner, Zertifikat per
      # keytool -printcert -jarfile lesen und gegen den Release-Key vergleichen.
      - name: Verify published AAB signature against release key
        if: steps.nightly.outputs.aab_published == 'true'
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          jarsigner -verify published.aab || { echo "::error::AAB-Integritätsprüfung (jarsigner -verify) fehlgeschlagen"; exit 1; }
          AAB_FP=$(keytool -printcert -jarfile published.aab 2>/dev/null | grep '^[[:space:]]*SHA256:' | sed 's/.*SHA256:[[:space:]]*//' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          KEY_FP=$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | grep '^[[:space:]]*SHA256:' | sed 's/.*SHA256:[[:space:]]*//' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          if [ -z "$AAB_FP" ] || [ -z "$KEY_FP" ]; then
            echo "::error::Fingerprint nicht ermittelbar (AAB='$AAB_FP' Key='$KEY_FP') — AAB-Signatur-Check abgebrochen"
            exit 1
          fi
          echo "AAB Signer SHA-256: $AAB_FP"
          echo "Key SHA-256:        $KEY_FP"
          if [ "$AAB_FP" != "$KEY_FP" ]; then
            echo "::error::Signatur-Mismatch — veröffentlichtes AAB ist NICHT mit dem Release-Key signiert!"
            exit 1
          fi
          echo "✅ Signatur verifiziert: veröffentlichtes AAB trägt den Release-Key"

      # ✅ Frischer Build mit exakt den veröffentlichten Parametern
      - name: Rebuild APK with published version params
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleStandardRelease \
            -PversionName="${{ steps.nightly.outputs.version_name }}" \
            -PversionCode="${{ steps.nightly.outputs.version_code }}" \
            --stacktrace --no-daemon

      # ✅ Frisches AAB (Bundle) mit denselben Parametern, falls publiziert
      - name: Rebuild AAB with published version params
        if: steps.nightly.outputs.aab_published == 'true'
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:bundleStandardPlayRelease \
            -PversionName="${{ steps.nightly.outputs.version_name }}" \
            -PversionCode="${{ steps.nightly.outputs.version_code }}" \
            --stacktrace --no-daemon

      # ✅ Hash-Vergleich: CI-Artefakte vs. frischer Build
      - name: Compare hashes
        run: |
          fail=0
          compare() {
            local name="$1" local_published="$2" local_rebuilt="$3"
            if cmp -s "$local_published" "$local_rebuilt"; then
              echo "✅ $name: BIT-IDENTISCH"
            else
              echo "::error::$name unterscheidet sich — Reproduzierbarkeit verletzt!"
              sha256sum "$local_published" "$local_rebuilt"
              fail=1
            fi
          }
          # Flavor-Pfade (standard/foss): Rebuild-Artefakte liegen unter
          # apk/standard/release bzw. bundle/standardPlayRelease mit
          # flavor-Dateinamen — identisch zu den Asset-Namen im Release.
          compare "app-standard-release.apk" published.apk app/build/outputs/apk/standard/release/app-standard-release.apk
          compare "mapping.txt" published-mapping.txt app/build/outputs/mapping/standardRelease/mapping.txt
          compare "output-metadata.json" published-output-metadata.json app/build/outputs/apk/standard/release/output-metadata.json
          # AAB nur vergleichen, wenn es im Release vorhanden ist
          if [ -f published.aab ]; then
            compare "app-standard-playRelease.aab" published.aab app/build/outputs/bundle/standardPlayRelease/app-standard-playRelease.aab
          fi
          if [ "$fail" -eq 1 ]; then
            exit 1
          fi
          echo "🎉 Alle Artefakte reproduzierbar"

      # ✅ R8-Nachweis APK-Kanal: die Rebuilds haben assembleRelease (und ggf.
      # bundleRelease) gebaut — das Mapping belegt, dass die Sentry-Opt-out-Logik
      # im ausgelieferten Nightly-APK enthalten ist (Lambda inlined in
      # io.sentry.SentryClient). Ergänzt die Reproduzierbarkeits-Prüfung.
      - name: Verify Sentry opt-out logic in release mapping
        run: bash scripts/check_sentry_optout_mapping.sh app/build/outputs/mapping/standardRelease/mapping.txt

      # ✅ Security-Loop-Check: release-grade Guards (Workflow-Security-
      # Selbsttest + Secret-Guard) laufen zusätzlich direkt am Release-Mapping —
      # die Regeln der Pipeline bleiben gegen bekannte Findings validierbar.
      - name: Check Security Loop
        run: |
          bash scripts/check_security_loop.sh
          bash scripts/check_security_loop.sh app/build/outputs/mapping/standardRelease/mapping.txt

  # ✅ Selbsttest der publish_play-Lane OHNE Play-Zugang (dry_run=true):
  # erzeugt einen lokalen Wegwerf-Keystore (keytool), baut bundleStandardPlayRelease und
  # verifiziert die AAB-Signatur per keytool gegen den Test-Key - kein Upload,
  # keine UPLOAD_*/PLAY_*-Secrets noetig. Laeuft bei jedem push/PR: die Lane ist
  # damit dauerhaft regressionstestbar, bevor echte Play-Secrets existieren.
  # (scripts/test_publish_play_dryrun.sh, inkl. Negativtest: Upload ohne
  # Play-Credentials muss am Credential-Guard scheitern.)
  test-publish-play:
    name: Self-Test publish_play (dry_run)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 25 (LTS)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run publish_play dry-run self-test
        run: bash scripts/test_publish_play_dryrun.sh

      # ✅ R8-Nachweis AAB-Kanal: der Dry-Run hat bundleStandardPlayRelease gebaut — das
      # Mapping belegt, dass die Sentry-Opt-out-Logik im Play-AAB enthalten ist
      # (Lambda inlined in io.sentry.SentryClient). Kostet keine Extra-Build-Zeit.
      - name: Verify Sentry opt-out logic in standardPlayRelease mapping
        run: bash scripts/check_sentry_optout_mapping.sh app/build/outputs/mapping/standardPlayRelease/mapping.txt

      # ✅ Security-Loop-Check für den Play-Kanal: gleiche Guards, Play-Mapping.
      - name: Check Security Loop (Play channel)
        run: bash scripts/check_security_loop.sh app/build/outputs/mapping/standardPlayRelease/mapping.txt

  # ✅ Regressionstest: gehärtete stabile Release-Publizierung (publish_release,
  # if-stable) lokal gegen einen Mock-gh — prüft Skip/Delete+Recreate/Retry/
  # Rollback, ohne echte Releases zu berühren (siehe scripts/README-Hinweis im
  # Test-Skript). Braucht nur plain Ruby (kein Bundler/Fastlane).
  test-publish-release-hardening:
    name: Self-Test publish_release (Hardening, Mock-gh)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
      - name: Run publish_release hardening self-test
        run: bash scripts/test_publish_release_hardening.sh

  # ✅ Selbsttest: Retry-Härtung der release-grade Gradle-Builds
  # (fastlane/build_retry.rb — Vorfall 05.09.2026: Beta-Release scheiterte an
  # transientem SSL-Fehler im Sentry-Mapping-Upload-Task nach 5:48 min
  # Buildzeit). Prüft Klassifikation (transient vs. deterministisch),
  # Retry-Zähler, Backoff-Delays und statisch, dass ALLE release-grade
  # gradle-Aufrufe gewrappt sind. Plain Ruby, keine Fastlane-/GitHub-Zugriffe.
  test-build-retry:
    name: Self-Test Build-Retry (Hardening)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
      - name: Run build retry self-test
        run: bash scripts/test_build_retry.sh

  # ✅ Regressionstest: SHA-256-Prüfsummen (fastlane/sha256sums.rb) — die
  # release_github-Stable-Lane publiziert seit 10.09.2026 BEIDE Flavor-APKs
  # plus GNU-SHA256SUMS.txt in jedem stable Release. Plain Ruby, offline.
  # (scripts/test_sha256sums.sh)
  test-sha256sums:
    name: Self-Test SHA256SUMS (GNU-Format & Determinismus)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
      - name: Run SHA256SUMS self-test
        run: bash scripts/test_sha256sums.sh

  # ✅ Regressionstest: Distributions-Quick-Wins — permanenter Latest-APK-
  # Permalink im README + Prüfsummen-Anhang in BEIDEN Publikations-Zweigen
  # (stable + nightly). Grep-basiert, offline.
  # (scripts/test_pinned_checksums.sh)
  test-pinned-checksums:
    name: Self-Test Pinned-Checksums (Permalink & Nightly-SUMS)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run pinned-checksums self-test
        run: bash scripts/test_pinned_checksums.sh

  # ✅ Regressionstest: Wöchentliche Stable-Distribution (distribution-stable.yml)
  # gegen die deploy-FDroid.yml/release-pipeline.yml-Ketten (Kadenz-Vertrag).
  # Grep-basiert + YAML-Parse, offline. (scripts/test_distribution_stable.sh)
  test-distribution-stable:
    name: Self-Test Stable-Distribution (Weekly Cadence)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run stable-distribution self-test
        run: bash scripts/test_distribution_stable.sh

  # ✅ Regressionstest: F-Droid-/IzzyOnDroid-Submissions-Metadata (foss-Flavor)
  # + FOSS-Konsistenz der Submission-Vorlage. Plain Ruby (YAML, offline).
  # (scripts/test_fdroid_metadata.sh)
  test-fdroid-metadata:
    name: Self-Test F-Droid-Metadata (foss)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
      - name: Run F-Droid-Metadata self-test
        run: bash scripts/test_fdroid_metadata.sh

  # ✅ Regressionstest: der nightly-Verify-Job (verify-reproducibility) muss
  # die flavor-korrekten Asset-Namen/Rebuild-Pfade nutzen (Vorfall 06.09.2026:
  # "app-release.apk fehlt im Release" — Asset heißt app-standard-release.apk,
  # seit die App die Flavors standard/foss hat). Grep-basiert, offline.
  # (scripts/test_verify_reproducibility.sh)
  test-verify-reproducibility:
    name: Self-Test Verify-Reproducibility (Asset-Namen)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run verify-reproducibility self-test
        run: bash scripts/test_verify_reproducibility.sh

  # ✅ Regressionstest: der Emulator-Test-Job (emulator-tests) muss beide
  # Runner-Architekturen abdecken — x86_64 authority-fähig mit KVM-Enablement
  # (udev-perms + /dev/kvm-Verifikation), arm64 experimentell (Vorfall
  # 06.09.2026: `HVF: HV_UNSUPPORTED` auf macos-latest/arm64; Linux scheiterte
  # ohne udev-perms am Boot-Timeout via -accel off). Grep-basiert, offline.
  # (scripts/test_emulator_matrix.sh)
  test-emulator-matrix:
    name: Self-Test Emulator-Matrix (Arch-Abdeckung)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run emulator matrix self-test
        run: bash scripts/test_emulator_matrix.sh

  publish-play:
    name: Publish to Google Play
    runs-on: ubuntu-latest
    # Nur manuell per workflow_dispatch (Play-Upload ist ein bewusster Akt):
    # niemals automatisch bei push/schedule ausloesen.
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Volle Historie fuer git describe --tags (Versionableitung im Fastfile)
          fetch-depth: 0

      - name: Set up JDK 25 (LTS)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Härtung: Play-Metadaten müssen vollständig sein (Icon, ≥2 Screenshots
      # 16:9/9:16, Store-Listing + Changelog pro Locale), sonst KEIN Upload —
      # ein Play-Release mit fehlenden Unterlagen würde in der Prüfung hängen.
      - name: Check Play metadata completeness
        run: bash scripts/check_play_metadata.sh

      # Play-Upload-Keystore dekodieren (UPLOAD_*-Secrets, getrennt vom Release-Key)
      - name: Decode Upload Keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::UPLOAD_KEYSTORE_BASE64 fehlt — Play-Upload ohne Upload-Key nicht moeglich. Abbruch."
            exit 1
          fi
          echo $UPLOAD_KEYSTORE_BASE64 | base64 -di > ${{ github.workspace }}/upload-keystore.jks
          echo "UPLOAD_KEYSTORE_PATH=${{ github.workspace }}/upload-keystore.jks" >> $GITHUB_ENV

      # AAB mit Upload-Key bauen, Signatur gegen den Key verifizieren, hochladen
      - name: Build AAB and upload to Google Play
        env:
          UPLOAD_KEYSTORE_PATH: ${{ env.UPLOAD_KEYSTORE_PATH }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          PLAY_JSON_KEY_FILE: ${{ secrets.PLAY_JSON_KEY_FILE }}
          PLAY_JSON_KEY_DATA: ${{ secrets.PLAY_JSON_KEY_DATA }}
          VERSION: ${{ github.event.inputs.version }}
          VERSION_CODE: ${{ github.event.inputs.version_code }}
          TRACK: ${{ github.event.inputs.track }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          args=()
          [ -n "$VERSION" ] && args+=(version:"$VERSION")
          [ -n "$VERSION_CODE" ] && args+=(version_code:"$VERSION_CODE")
          [ -n "$TRACK" ] && args+=(track:"$TRACK")
          args+=(dry_run:"$DRY_RUN")
          bundle exec fastlane publish_play "${args[@]}"
  # ✅ Selbstprüfung: verwaiste Draft-Releases auf v*-Tags melden (ohne
  # Auto-Löschung — ein menschlich angelegter Draft kann legitim sein).
  # Fängt Reste abgebrochener Stable-Runs (hart abgewürgter Runner: der
  # Rollback in publish_release konnte nicht mehr laufen). Läuft auf
  # Schedule/Manual, NICHT auf Push — während publish-release parallel ein
  # Release neu erstellt, wäre eine Draft-Meldung transient und irreführend.
  sweep-orphan-drafts:
    name: Sweep Orphan Draft Releases (v*)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Sweep orphan draft releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec fastlane sweep_orphan_drafts
