name: Automation / Contributors Reminder

# Erinnert an die CONTRIBUTORS.md-Pflege und dankt öffentlich, sobald ein
# Fork-PR gemergt wurde: Auf jedem develop-Push werden Fork-Squash-Merges seit
# dem letzten Reminder gesucht — fehlende bzw. noch auf `offen` stehende
# Beitragseintraege landen im Auto-Issue, der gemergte PR erhaelt einen
# oeffentlichen Dank-/Ankündigungs-Kommentar (Idempotenz-Marker
# `<!-- contributors-credit -->`), der beim Nachziehen automatisch zum Dank
# editiert wird (geschlossener Regelkreis, pending-Tracking im State-Marker).
# Einmaliger Backfill via workflow_dispatch mit BACKFILL_SINCE=<ISO> (nur
# validierte Zeitstempel). Die Pflege selbst bleibt Maintainer-Handarbeit.
#
# Bewusst KEIN Bot-PR (kein Branch-Push, kein PR-Create): der T1-T13-Vertrag
# aus scripts/test_bot_pr_credentials.sh gilt hier nicht — `issues: write`
# genuegt. GITHUB_TOKEN fliesst nur als Issue-Text (Daten, kein Code).

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions: {}

jobs:
  reminder:
    name: Fork-PR-Merges auf Beitragseintraege pruefen
    runs-on: ubuntu-latest
    permissions:
      issues: write
    # Gleiche Guard-Philosophie wie automation-changelog.yml: Dependabot
    # stoesst keine Automatik an.
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop

      - name: Fork-Merges gegen CONTRIBUTORS.md pruefen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/contributors_reminder.sh
