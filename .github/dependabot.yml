# Dependabot Configuration for Vivid
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Gradle Dependencies (libs.versions.toml)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    # Gruppierung Reduziert PR-Aufwand
    groups:
      # Kotlin Dependencies (stdlib, plugin, serialization)
      kotlin:
        patterns:
          - "org.jetbrains.kotlin"
          - "org.jetbrains.kotlinx"
      # Compose Dependencies (BOM, UI, Material)
      compose:
        patterns:
          - "androidx.compose"
      # AndroidX Core (lifecycle, activity, navigation)
      androidx:
        patterns:
          - "androidx.*"
        exclude-patterns:
          - "androidx.compose"
      # Testing Dependencies
      testing:
        patterns:
          - "junit*"
          - "mockk*"
          - "mockito*"
          - "espresso*"
          - "turbine"
      # Networking Dependencies
      networking:
        patterns:
          - "io.ktor"
          - "com.squareup.okhttp3"
      # Media Dependencies
      media:
        patterns:
          - "androidx.media3"
          - "io.coil-kt"
    # Labels für bessere Übersicht
    labels:
      - "dependencies"
      - "gradle"
    # Commit-Message-Prefix
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions (SHA-Pins)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    # SHA-Pins werden automatisch erkannt
    # Dependabot liest die `# vX`-Kommentare
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
