name: GitHub Pages

# Publiziert PRIVACY.md als statische Seite unter
# https://thoser666.github.io/Vivid/privacy/
# (Workflow kopiert PRIVACY.md nach docs/privacy/index.html und deployt via
#  actions/configure-pages + upload-pages-artifact + deploy-pages).
# Trigger: nur wenn PRIVACY.md sich ändert (oder manuell via workflow_dispatch).

on:
  push:
    branches: [develop]
    paths:
      - 'PRIVACY.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PRIVACY.md → docs/privacy/index.html
        # Markdown → HTML mit Python (markdown-Paket via pip; pandoc ist auf
        # den GitHub-Runnern nicht vorinstalliert). Ergebnis: docs/privacy/index.html
        run: |
          python3 -m pip install --quiet markdown
          python3 - <<'PYEOF'
          import markdown, pathlib
          src = pathlib.Path('PRIVACY.md').read_text(encoding='utf-8')
          body = markdown.markdown(src, extensions=['tables', 'fenced_code', 'sane_lists'])
          # Platzhalter-Ersetzung statt .format(): die CSS-Klammern würden sonst
          # als Format-Platzhalter interpretiert (KeyError).
          html = '''<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Vivid — Privacy Policy</title>
            <style>
              /* Responsive Basis: kein horizontaler Seiten-Überlauf auf Mobile. */
              * { box-sizing: border-box; }
              html { -webkit-text-size-adjust: 100%; }
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                     max-width: 800px; margin: 0 auto; padding: 1rem;
                     line-height: 1.6; color: #1f2328; }
              h1, h2, h3 { line-height: 1.25; }
              /* Breite Tabellen (z. B. Drittanbieter-Tabelle) scrollen horizontal
                 statt die Seite zu sprengen. */
              table { display: block; width: 100%; overflow-x: auto;
                      border-collapse: collapse; -webkit-overflow-scrolling: touch; }
              th, td { border: 1px solid #d0d7de; padding: .4rem .6rem; text-align: left; }
              th { background: #f6f8fa; }
              /* Lange URLs/Befehle umbrechen statt überlaufen. */
              code { background: #f6f8fa; padding: .1rem .3rem; border-radius: 4px;
                     overflow-wrap: break-word; word-break: break-word; }
              pre { overflow-x: auto; }
              a { overflow-wrap: break-word; word-break: break-word; }
              img { max-width: 100%; height: auto; }
            </style>
          </head>
          <body>
          __BODY__
          </body>
          </html>'''.replace('__BODY__', body)
          out = pathlib.Path('docs/privacy')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'index.html').write_text(html, encoding='utf-8')
          PYEOF
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact (docs/)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
