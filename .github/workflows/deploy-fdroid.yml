name: Deploy / F-Droid

on:
  # Trigger on new releases
  release:
    types: [published]
  
  # Weekly update check
  schedule:
    - cron: '0 4 * * 1'
  
  # Manual trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., v0.5.7-beta)'
        required: false
        default: 'latest'

# Only one run at a time
concurrency:
  group: fdroid-repo
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-repo:
    name: Build F-Droid Repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      
      - name: Install fdroidserver
        run: pip install fdroidserver
      
      - name: Determine version to build
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.version }}" != "latest" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download APK from GitHub Release
        run: |
          cd fdroid
          mkdir -p repo
          gh release download ${{ steps.version.outputs.VERSION }} \
            --pattern "*.apk" \
            --pattern "*-unsigned.apk" \
            --dir ./repo/ \
            --skip-existing
          
          echo "Downloaded APKs:"
          ls -la repo/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build F-Droid repository
        env:
          F_DROID_KEYSTORE: ${{ secrets.F_DROID_KEYSTORE }}
          F_DROID_KEY_ALIAS: ${{ secrets.F_DROID_KEY_ALIAS }}
          F_DROID_KEY_PASSWORD: ${{ secrets.F_DROID_KEY_PASSWORD }}
          F_DROID_KEY_DNAME: ${{ secrets.F_DROID_KEY_DNAME }}
        run: |
          cd fdroid
          
          # Decode keystore from secret
          echo "$F_DROID_KEYSTORE" | base64 -d > keystore.p12
          
          # Create config with signing key (no metadata - we'll add it manually)
          cat > config.yml << EOF
          builds_dir: repo
          repo_url: https://thoser666.github.io/Vivid/fdroid/repo
          repo_name: Vivid
          repo_description: "Vivid - Open Source IRL Streaming App with Chat Bot & AI Features"
          repo_icon: icon.png
          archive_older: 0
          keystorepass: ${F_DROID_KEY_PASSWORD}
          keypass: ${F_DROID_KEY_PASSWORD}
          repo_keyalias: ${F_DROID_KEY_ALIAS}
          keydname: ${F_DROID_KEY_DNAME}
          EOF
          
          # Generate repo index
          fdroid update --create-metadata -v
          
          # Verify repository was created
          if [ ! -f "repo/index.xml" ]; then
            echo "Error: Repository index.xml not created"
            exit 1
          fi
          
          # Add metadata to index.xml using Python
          python3 << 'PYTHON_SCRIPT'
          import xml.etree.ElementTree as ET
          import re
          
          # Read the current index.xml
          with open('repo/index.xml', 'r') as f:
              content = f.read()
          
          # Add metadata to application element
          # Find the application element and replace empty tags
          metadata = {
              '<summary></summary>': '<summary>Open source IRL streaming app with chat bot and AI features</summary>',
              '<desc>No description available</desc>': '<desc>Vivid is an open-source IRL streaming application for Android. Features include live streaming via RTMP/SRT to Twitch, YouTube, Kick, and custom platforms, real-time chat overlay with badges and emotes, AI-powered chat bot with configurable responses, owner remote control commands, dark mode with AMOLED support, multi-language support (English, German, French), scene management and auto-switching, real-time GPS overlay, and custom RTMP/SRT endpoints.</desc>',
              '<license>Unknown</license>': '<license>MIT</license>',
              '<web></web>': '<web>https://thoser666.github.io/Vivid/</web>',
              '<source></source>': '<source>https://github.com/thoser666/Vivid</source>',
              '<tracker></tracker>': '<tracker>https://github.com/thoser666/Vivid/issues</tracker>',
              '<categories>fdroid</categories>': '<categories>Internet,Entertainment,Multimedia</categories>',
              '<category>fdroid</category>': '<category>Internet</category>',
          }
          
          for old, new in metadata.items():
              content = content.replace(old, new)
          
          # Write the updated index.xml
          with open('repo/index.xml', 'w') as f:
              f.write(content)
          
          print("Successfully updated index.xml with metadata")
          PYTHON_SCRIPT
          
          echo "Repository built successfully"
          ls -la repo/
          
          # Cleanup keystore
          rm -f keystore.p12
      
      - name: Copy to docs/fdroid
        run: |
          # Ensure docs/fdroid/repo exists
          rm -rf docs/fdroid
          mkdir -p docs/fdroid
          
          # Copy repo files
          cp -r fdroid/repo docs/fdroid/
          
          # Copy QR code
          cp docs/fdroid-repo-qr.svg docs/fdroid/qr.svg
          
          # Verify
          echo "Files in docs/fdroid:"
          ls -la docs/fdroid/
          echo ""
          echo "Files in docs/fdroid/repo:"
          ls -la docs/fdroid/repo/
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check for new or changed files (git diff misses untracked dirs)
          git add docs/fdroid/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update F-Droid repository for ${{ steps.version.outputs.VERSION }}"
            git push
          fi
