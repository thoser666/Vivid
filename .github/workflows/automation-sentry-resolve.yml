# Sentry-Resolve per Dispatch (Vivid): schliesst Sentry-Issues, die beim
# Release-Schnitt bzw. in der Triage als erledigt entschieden wurden.
#
# Warum ein eigener Workflow: `SENTRY_RESOLVE_TOKEN` (project:read + project:write)
# liegt nur als CI-Secret vor — lokal ist kein Schreibzugriff moeglich (der
# Guard meldet dann SKIP). Der woechentliche Stable-Lauf ruft den Guard mit
# `--version` (Event-Tag-Vertrag) auf; fuer den ID-Entscheid „kein Defekt /
# erwarteter Betriebszustand" gibt es diesen manuellen Pfad (docs/sentry-issues.md
# §5.10, docs/sentry-stats.md §6 Punkt 4).
#
# Seit 27.11.2026 kennt der ID-Pfad den Input `in_next_release`: dann setzt der
# Guard den Status `resolvedInNextRelease` (Befund in einem konkreten Release behoben,
# ohne fix-release-Event-Tag — #429/VIVID-5Q, Fix erstmals in v0.5.51-beta).
#
# Verdicts des Guards sind bewusst keine Gate-Blocker: fehlender/abgelaufener
# Token ergibt SKIP (exit 0), nur Aufruffehler sind FEHLER (exit 1).
name: Automation / Sentry Resolve

on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Sentry-Issue-IDs, kommagetrennt (z. B. 7822620409,7822620394)'
        required: true
        type: string
      dry_run:
        description: 'Nur anzeigen, kein PUT'
        required: false
        type: boolean
        default: false
      in_next_release:
        description: 'Als "resolved in next release" markieren statt nur resolved (nur mit ids)'
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: sentry-resolve
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve issues by id
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Sentry: Issues per ID resolven (resolved; inNextRelease per Input)'
        env:
          SENTRY_RESOLVE_TOKEN: ${{ secrets.SENTRY_RESOLVE_TOKEN }}
          SENTRY_ORG: privat-jb
          SENTRY_PROJECT: vivid
          # Inputs ausschliesslich ueber Env — kein '${{ }}' im run-Block.
          IDS_INPUT: ${{ inputs.ids }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          IN_NEXT_RELEASE_INPUT: ${{ inputs.in_next_release }}
        run: |
          set -euo pipefail
          if [ -z "${IDS_INPUT:-}" ]; then
            echo "::error::Input 'ids' ist leer — kommagetrennte Sentry-Issue-IDs noetig"
            exit 1
          fi
          args=(--ids "$IDS_INPUT")
          if [ "${IN_NEXT_RELEASE_INPUT:-false}" = "true" ]; then
            args+=(--in-next-release)
          fi
          if [ "${DRY_RUN_INPUT:-false}" = "true" ]; then
            args+=(--dry-run)
          fi
          SENTRY_RESOLVE_STATUS_OUT="$RUNNER_TEMP/sentry-status.json" \
          SENTRY_RESOLVE_PUT_OUT="$RUNNER_TEMP/sentry-put.json" \
            bash scripts/check_sentry_resolve.sh "${args[@]}"
          # Beobachteten Status protokollieren (Diagnose, keine Secrets):
          # zeigt, welchen Status Sentry fuer die IDs tatsaechlich liefert.
          if [ -f "$RUNNER_TEMP/sentry-status.json" ]; then
            cat "$RUNNER_TEMP/sentry-status.json"
          fi
          # Antwort des Resolve-PUT: ein 200 heisst nur, dass die Anfrage ankam.
          if [ -f "$RUNNER_TEMP/sentry-put.json" ]; then
            echo "PUT-Antwort (Sentry):"
            cat "$RUNNER_TEMP/sentry-put.json"
          fi
