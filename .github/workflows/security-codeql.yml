name: Security / CodeQL

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:
  schedule:
    # Wöchentlich Mo 04:00 UTC — Default-Branch-Scan unabhängig von PRs.
    - cron: "0 4 * * 1"

permissions: {}

# Permissions are scoped to the analysis job below.
# Ein aktiver Lauf pro Branch/PR — bei Re-Push wird der alte abgebrochen.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (Kotlin/Java)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        language: [ java-kotlin ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 25 (LTS)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"

      # SHA-Pins (Supply-Chain), konsistent mit der CI-Härtung in RELEASE.md:
      # Beide Actions stammen aus demselben Release-Tag v4.38.3 (Tag-Commit
      # 24c54180… inkl. `# v4.38.3`-Kommentar, Same-Release über alle vier
      # Pin-Stellen — Vertrag K1 in scripts/test_codeql_kotlin.sh).
      # Bundle-Lag-Lehre (github/codeql#22404): Der Trace-Build kompiliert
      # seit der Blockaden-Aufhebung (15.10.2026) MIT DER Katalog-Version
      # aus gradle/libs.versions.toml — Bundle 2.27.2 (Default von v4.38.3,
      # lib/defaults.json) trägt den benötigten Kotlin-Extractor.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          # Security-relevante Query-Pakete zusätzlich zum Standard.
          queries: security-extended,security-and-quality

      # Manueller statt Autobuild: deterministisch kt-Kompilierung des App-Moduls
      # (CodeQL traced die Build-Schritte für Datenfluss-Analyse).
      #
      # Hier stand bis 15.10.2026 der Step „Pin Kotlin for CodeQL extractor"
      # (Bundle-Lag github/codeql#22404): Er zwang den Trace-Build auf
      # Kotlin 2.4.10, weil Bundle 2.27.0 Kotlin >= 2.4.20 noch ablehnte
      # („supports versions below 2.4.20"). Entfernt, nachdem Bundle 2.27.2
      # (Default von codeql-action v4.38.3) den Extractor liefert —
      # empirisch verifiziert per workflow_dispatch-Lauf auf dem Verify-Branch
      # (grüner Trace mit Katalog-Kotlin, Beleg in RELEASE.md „Bundle-Lag-Lehre").
      # Nächster Lag: scripts/check_codeql_blockade.sh warnt, sobald der
      # Katalog über dem verifizierten Extractor-Stand (2.4.21) liegt — dann
      # analog wieder pinnen UND scripts/test_codeql_kotlin.sh anpassen.

      - name: Build Debug APK (CodeQL trace)
        run: ./gradlew :app:assembleDebug --console=plain

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"