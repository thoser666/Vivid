# Dependabot Auto-Merge
# Automatisiert den Merge von Dependabot-PRs (Minor/Patch) nach grüner CI
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/automating-dependabot-with-github-actions

name: Dependabot Auto-Merge

on:
  pull_request:

permissions: {}

concurrency:
  group: dependabot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Nur für Dependabot-PRs
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Check update type
        id: check
        run: |
          # Nur Minor und Patch Updates automatisch mergen
          UPDATE_TYPE="${{ steps.metadata.outputs.update-type }}"
          echo "Update-Typ: $UPDATE_TYPE"
          
          if [ "$UPDATE_TYPE" = "version-update:semver-minor" ] || [ "$UPDATE_TYPE" = "version-update:semver-patch" ]; then
            echo "auto_merge=true" >> "$GITHUB_OUTPUT"
            echo "✅ Minor/Patch Update — Auto-Merge erlaubt"
          else
            echo "auto_merge=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Major Update — manueller Review erforderlich"
          fi

      - name: Approve PR
        if: steps.check.outputs.auto_merge == 'true'
        run: |
          gh pr review --approve "$PR_URL"
          echo "✅ PR genehmigt"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        id: merge
        if: steps.check.outputs.auto_merge == 'true'
        run: |
          # Frueherer Defekt (Run 38247604436, 13.10.2026, upload-artifact-Bump):
          # `gh pr merge --auto` scheiterte, der Fehlertext ging in einem
          # verschluckten stderr verloren, und der Fallback erriet daraus
          # "keine Branch-Protection" — falsch, denn auto-merge ist im Repo
          # aktiv (allow_auto_merge=true) und die Pflicht-Checks "Build & Test"
          # und "Secret Guard" stehen. Der Nachschub, ein direkter Merge, fiel
          # dann mit dem ECHTEN Grund rot:
          #   GraphQL: refusing to allow a GitHub App to create or update
          #   workflow `.github/workflows/release-pipeline.yml` without
          #   `workflows` permission (mergePullRequest)
          # Gegenprobe: PR #291 (setup-ruby) aenderte dieselben
          # Workflow-Dateien und wurde ueber --auto gemergt — die Verweigerung
          # ist also nicht pro Datei vorhersehbar. Deshalb wird hier nicht
          # vorbeblockiert, sondern die Ursache gelesen und klassifiziert:
          # nur der erwartete Zustand endet gruen, mit Warnung und
          # Hinweiskommentar am PR statt mit einem roten Job.
          ERR="$(mktemp)"
          if gh pr merge --auto --squash "$PR_URL" 2>"$ERR"; then
            echo "merge_action=auto-merge" >> "$GITHUB_OUTPUT"
            echo "✅ Auto-Merge aktiviert (squash)"
          elif grep -qF 'without `workflows` permission' "$ERR"; then
            # Erwarteter Zustand: das GITHUB_TOKEN hat keinen `workflows`-Scope
            # und darf PRs, die .github/workflows/* aendern, nicht mergen
            # (auch nicht per --admin; Beleg cli/cli#11493). Der PR bleibt
            # offen und braucht einen menschlichen Merge.
            echo "merge_action=manual-required" >> "$GITHUB_OUTPUT"
            echo "::warning title=Manueller Merge noetig::GITHUB_TOKEN darf PRs mit .github/workflows/*-Aenderung nicht mergen — bitte manuell mergen."
            marker='dependabot-auto-merge: manual-merge-required'
            have="$(gh pr view "$PR_URL" --json comments --jq "[.comments[] | select(.body != null) | .body] | any(contains(\"$marker\"))" 2>>"$ERR" || echo false)"
            if [ "$have" != "true" ]; then
              body="⚠️ **Manueller Merge erforderlich** — das GITHUB_TOKEN darf diesen PR nicht mergen, weil er \`.github/workflows/*\` ändert. Minor/Patch ist bestätigt; bitte einmal manuell mergen. (Marker: \`$marker\`)"
              gh pr comment "$PR_URL" --body "$body" >>"$ERR" 2>&1 || echo "::warning::Hinweiskommentar fehlgeschlagen: $(tr '\n' ' ' <"$ERR")"
            fi
          elif grep -qF 'Auto merge is not allowed' "$ERR"; then
            # Repo-Setting (Settings → General → Pull Requests → Auto-merge)
            # ist aus — Konfigurationsfehler, kein PR-Zustand: hart rot.
            echo "merge_action=disabled" >> "$GITHUB_OUTPUT"
            echo "::error::Auto-Merge ist fuer das Repository deaktiviert — $(tr '\n' ' ' <"$ERR")"
            exit 1
          else
            # Unbekannter Grund: hart rot, mit dem VOLLSTAENDIGEN Fehlertext —
            # genau die Verdeckung, die dieser Step frueher hatte.
            echo "merge_action=failed" >> "$GITHUB_OUTPUT"
            echo "::error::gh pr merge --auto fehlgeschlagen: $(tr '\n' ' ' <"$ERR")"
            exit 1
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Dependabot Auto-Merge" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Feld | Wert |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Update-Typ | ${{ steps.metadata.outputs.update-type }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dependency | ${{ steps.metadata.outputs.dependency-name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | ${{ steps.metadata.outputs.previous-version }} → ${{ steps.metadata.outputs.new-version }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Auto-Merge | ${{ steps.check.outputs.auto_merge }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Merge-Versuch | ${MERGE_OUTCOME:-nicht versucht} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.check.outputs.auto_merge }}" = "true" ]; then
            echo "✅ Minor/Patch Update — wird nach grüner CI automatisch gemergt." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Major Update — erfordert manuellen Review." >> "$GITHUB_STEP_SUMMARY"
          fi
          case "${MERGE_OUTCOME:-}" in
            manual-required)
              echo "⚠️ Dieser PR ändert .github/workflows/* — manueller Merge erforderlich; der Hinweis liegt als Kommentar am PR." >> "$GITHUB_STEP_SUMMARY"
              ;;
            disabled|failed)
              echo "❌ Merge nicht möglich (${MERGE_OUTCOME}) — echte Ursache steht im Schritt „Enable auto-merge“." >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac
        env:
          MERGE_OUTCOME: ${{ steps.merge.outputs.merge_action }}

  # Benachrichtigung bei Major-Updates (optional)
  notify-major:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    if: github.actor == 'dependabot[bot]'
    needs: auto-merge
    steps:
      - name: Check if major update
        id: check
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Metadata aus dem vorherigen Job lesen ist nicht möglich,
          # daher hier erneut prüfen
          if printf '%s\n' "$PR_TITLE" | grep -qE "^(build|chore|deps).*major"; then
            echo "is_major=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_major=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add comment for major updates
        if: steps.check.outputs.is_major == 'true'
        run: |
          gh pr comment "$PR_URL" --body "⚠️ **Major Update erkannt** — Dieses Update erfordert einen manuellen Review. Bitte prüfe die Breaking Changes in der Dependency."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
