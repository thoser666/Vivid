name: F-Droid Repository

on:
  # Trigger on new releases
  release:
    types: [published]
  
  # Weekly update check
  schedule:
    - cron: '0 4 * * 1'
  
  # Manual trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., v0.5.7-beta)'
        required: false
        default: 'latest'

# Only one run at a time
concurrency:
  group: fdroid-repo
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-repo:
    name: Build F-Droid Repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      
      - name: Install fdroidserver
        run: pip install fdroidserver
      
      - name: Determine version to build
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.version }}" != "latest" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download APK from GitHub Release
        run: |
          cd fdroid
          mkdir -p repo
          gh release download ${{ steps.version.outputs.VERSION }} \
            --pattern "*.apk" \
            --pattern "!*-unsigned.apk" \
            --dir ./repo/ \
            --skip-existing
          
          echo "Downloaded APKs:"
          ls -la repo/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build F-Droid repository
        env:
          F_DROID_KEYSTORE: ${{ secrets.F_DROID_KEYSTORE }}
          F_DROID_KEY_ALIAS: ${{ secrets.F_DROID_KEY_ALIAS }}
          F_DROID_KEY_PASSWORD: ${{ secrets.F_DROID_KEY_PASSWORD }}
          F_DROID_KEY_DNAME: ${{ secrets.F_DROID_KEY_DNAME }}
        run: |
          cd fdroid
          
          # Decode keystore from secret
          echo "$F_DROID_KEYSTORE" | base64 -d > keystore.p12
          
          # Create config with signing key
          # Copy icon for repo
          cp ../fastlane/metadata/android/images/icon.png ../fastlane/metadata/android/images/icon.png.bak 2>/dev/null || true
          
          cat > config.yml << YAMLEOF
          builds_dir: repo
          repo_url: https://thoser666.github.io/Vivid/fdroid/repo
          repo_name: Vivid
          archive_older: 0
          keystorepass: ${F_DROID_KEY_PASSWORD}
          keypass: ${F_DROID_KEY_PASSWORD}
          keyalias: ${F_DROID_KEY_ALIAS}
          keydname: ${F_DROID_KEY_DNAME}
          YAMLEOF
          
          # Generate repo index with metadata creation
          fdroid update --create-metadata -v
          
          # Verify repository was created
          if [ ! -f "repo/index.xml" ]; then
            echo "Error: Repository index.xml not created"
            exit 1
          fi
          
          echo "Repository built successfully"
          ls -la repo/
          
          # Cleanup keystore
          rm -f keystore.p12
      
      - name: Copy to docs/fdroid
        run: |
          # Ensure docs/fdroid/repo exists
          rm -rf docs/fdroid
          mkdir -p docs/fdroid
          
          # Copy repo files
          cp -r fdroid/repo docs/fdroid/
          
          # Copy QR code
          cp docs/fdroid-repo-qr.svg docs/fdroid/qr.svg
          
          # Verify
          echo "Files in docs/fdroid:"
          ls -la docs/fdroid/
          echo ""
          echo "Files in docs/fdroid/repo:"
          ls -la docs/fdroid/repo/
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes
          if git diff --quiet docs/fdroid/; then
            echo "No changes to commit"
          else
            git add docs/fdroid/
            git commit -m "chore: update F-Droid repository for ${{ steps.version.outputs.VERSION }}"
            git push
          fi
