name: Check Moblin Features

on:
  schedule:
    # Wöchentlich: Montag 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  check-moblin:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check Moblin features
        id: check
        run: |
          chmod +x scripts/check_moblin_features.sh
          if bash scripts/check_moblin_features.sh; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=new_features" >> "$GITHUB_OUTPUT"
          fi

      - name: Create issue if new features found
        if: steps.check.outputs.status == 'new_features'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            // Der Report wird vom Check-Skript nach report.md im
            // Arbeitsverzeichnis (Repo-Root) geschrieben, NICHT nach
            // /tmp/report.md - letzteres existiert dort nie und würde den
            // github-script-Step mit ENOENT crashen.
            const report = fs.readFileSync('report.md', 'utf8').toString();
            const title = `🔍 Moblin-Feature-Check: Neue Features erkannt (${new Date().toISOString().split('T')[0]})`;

            // Dedup: Nur ein offenes Moblin-Check-Issue gleichzeitig.
            // Ohne diesen Guard würde der wöchentliche Lauf jedes Mal ein
            // neues (Fehlalarm-)Issue anlegen.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'moblin',
              per_page: 100
            });
            if (open.length > 0) {
              const first = open[0];
              core.notice(`Open Moblin-Check issue already exists: #${first.number} (${open.length} total) - skipping creation.`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: first.number,
                body: `## Aktueller Lauf (${new Date().toISOString().split('T')[0]})\n\n${report}`
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: `## Automatischer Moblin-Feature-Check\n\n${report}\n\n---\n*Erstellt von automatischem Weekly-Check workflow*`,
              labels: ['parity', 'moblin', 'automated']
            });

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.status }}" = "ok" ]; then
            echo "✅ Keine neuen Moblin-Features gefunden — PARITY.md ist aktuell." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ Neue Moblin-Features erkannt — siehe erstelltes Issue." >> "$GITHUB_STEP_SUMMARY"
          fi
