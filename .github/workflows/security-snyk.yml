# Snyk Security Scanning
# Analysiert Dependencies auf bekannte Schwachstellen (CVEs)
# Docs: https://docs.snyk.io/developer-tools/integrations/snyk-ci-cd-integrations/github-actions-for-snyk-setup-and-checking-for-vulnerabilities

name: Security / Snyk

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    # Wöchentlich: Montag 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: snyk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snyk-test:
    name: Snyk Dependency Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Snyk test
        # Snyk gradle-jdk17 bringt eigenes JDK 17 mit — kein setup-java nötig,
        # da JAVA_HOME (JDK 25) den Container-Internals widerspricht.
        uses: snyk/actions/gradle-jdk17@12140f4059e244892ae643824a95459a102120dd # master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects --sarif-file-output=snyk-results.sarif

      - name: Upload Snyk results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@6ba5c05dce207b48ae07f8791b4313069c63fc2b # v3.26.6
        if: always() && hashFiles('snyk-results.sarif') != ''
        with:
          sarif_file: snyk-results.sarif

      - name: Summary
        if: always()
        run: |
          echo "## Snyk Security Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Feld | Wert |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | ${{ github.event_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | ${{ github.ref_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Severity Threshold | high |" >> "$GITHUB_STEP_SUMMARY"
          if [ -f snyk-results.sarif ]; then
            echo "| SARIF-Upload | ✅ |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| SARIF-Upload | ⚠️ Keine Datei (Snyk-Fehler oder keine Vulnerabilities) |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Ergebnisse werden im Security-Tab → Code Scanning angezeigt." >> "$GITHUB_STEP_SUMMARY"

  snyk-monitor:
    name: Snyk Monitor (Dashboard)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Snyk monitor
        # Snyk gradle-jdk17 bringt eigenes JDK 17 mit — kein setup-java nötig.
        uses: snyk/actions/gradle-jdk17@12140f4059e244892ae643824a95459a102120dd # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: monitor
          args: --all-projects

      - name: Summary
        run: |
          echo "## Snyk Monitor (Dashboard Update)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Dashboard aktualisiert: https://app.snyk.io" >> "$GITHUB_STEP_SUMMARY"
