name: Automation / Changelog

on:
  # ⚠️ Limitation: Releases, die die Pipeline per `gh release create` mit
  # GITHUB_TOKEN erstellt, feuern KEIN `release: published`-Event. Die nightly-
  # Pflege passiert deshalb direkt im publish-release-Job von
  # release-pipeline.yml (Schritt "Update CHANGELOG.md from GitHub releases").
  # Dieser Workflow greift hier nur für manuelle/UI-Releases + manuellen Refresh.
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

# Serialisiert: zwei gleichzeitige Release-Events dürfen nicht um denselben
# Commit auf develop kämpfen.
concurrency:
  group: changelog
  cancel-in-progress: false

jobs:
  update:
    name: Mirror GitHub Releases → CHANGELOG.md
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Gleiche Guard-Philosophie wie in release-pipeline.yml: Dependabot
    # (auch per manuellem Merge) stößt keine Automatik an.
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          # Root-Fix CI-Suppression: Der Bot-Branch muss mit einem USER-Credential
          # gepusht werden (nicht GITHUB_TOKEN) — sonst unterdrückt GitHub die
          # pull_request-Workflows auf dem Bot-PR und die Pflicht-Checks
          # (Build & Test, Secret Guard) laufen nie (Vorfall PRs #142/#143).
          # Fallback: GITHUB_TOKEN (altes Verhalten, mit ::warning::-Hinweis
          # im PR-Step). Secret anlegen: gh secret set AUTOMATION_TOKEN
          # (Fine-grained PAT: Contents + Pull requests RW auf dieses Repo).
          token: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Update CHANGELOG.md from GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/update_changelog.sh

      # Der Commit läuft als github-actions[bot] → release-pipeline.yml
      # überspringt dafür publish-release/verify (Guard unten), sonst gäbe
      # es eine Endlosschleife: Changelog-Commit → Nightly → Release → Changelog.
      # (Der Loop-Guard hängt am Commit-AUTHOR, nicht am Push-Credential —
      # der Author bleibt daher github-actions[bot].)
      # Branch Protection verbietet direkte Bot-Pushes auf develop → Branch +
      # PR; gemergt wird manuell (der Solo-Betreuer kann mit Admin-Bypass
      # direkt pushen).
      # Push + PR-Open laufen über das USER-Credential (AUTOMATION_TOKEN),
      # damit die Pflicht-Checks auf dem PR laufen — siehe Checkout oben.
      - name: Commit to PR if changed
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_AUTOMATION_TOKEN: ${{ secrets.AUTOMATION_TOKEN != '' }}
        run: |
          if [ "$HAS_AUTOMATION_TOKEN" != "true" ]; then
            echo "::warning::AUTOMATION_TOKEN ist nicht gesetzt — Bot-PR entsteht per GITHUB_TOKEN-Fallback. GitHub unterdrückt dann die Pflicht-Checks (Build & Test, Secret Guard) auf diesem PR (Rekursions-Schutz). Einmalig anlegen: gh secret set AUTOMATION_TOKEN --body <PAT> — Fine-grained PAT mit Contents+Pull requests (RW) auf dieses Repo."
          fi
          if git diff --quiet CHANGELOG.md; then
            echo "CHANGELOG.md unverändert — nichts zu committen"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="chore/changelog-update-$(date +%Y%m%d%H%M%S)"
          git checkout -b "$BRANCH"
          git add CHANGELOG.md
          git commit -m "docs: Update CHANGELOG from GitHub releases"
          git push origin "$BRANCH"
          # REST statt `gh pr create` (GraphQL createPullRequest): Fine-grained
          # PATs scheitern an der GraphQL-Mutation auch mit korrekter
          # Pull-requests-Permission — der REST-Endpoint funktioniert.
          # Rollback-Härtung: Scheitert der PR-Create, bleibt der bereits
          # gepushte Branch als Orphan zurück → Branch löschen, dann laut
          # abbrechen (siehe Orphan-Vorfall der Runs 34021546368/34022706363).
          if ! gh api repos/${{ github.repository }}/pulls -f title="docs: Update CHANGELOG from GitHub releases" -f head="$BRANCH" -f base=develop -F body="Automatische CHANGELOG-Spiegelung von GitHub Releases. Zum Übernehmen mergen (erforderliche Checks laufen im PR)."; then
            echo "::error::PR-Create fehlgeschlagen — Rollback: Bot-Branch $BRANCH wird gelöscht (kein Orphan)"
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH" \
              || echo "::warning::Branch-Rollback fehlgeschlagen — manuell löschen: gh api -X DELETE repos/${{ github.repository }}/git/refs/heads/$BRANCH"
            exit 1
          fi
          echo "✅ Bot-PR erstellt ($BRANCH)"
