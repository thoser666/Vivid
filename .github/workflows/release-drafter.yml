# Release Drafter
# Erstellt und aktualisiert automatisch Draft-Releases basierend auf gemergten PRs
# Docs: https://github.com/release-drafter/release-drafter

name: Release Drafter

on:
  push:
    branches:
      - develop
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-drafter
  cancel-in-progress: false

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    # Kein Release für Dependabot-Merges (Loop-Schutz). Fork-PRs werden
    # komplett geskippt: Das GITHUB_TOKEN darf dort keine Draft-Releases
    # anlegen ("Resource not accessible by integration", PR #230) — der Job
    # würde sonst auf jedem Fork-PR rot laufen.
    if: github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Release Drafter
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-name: release-drafter.yml
          commitish: develop
          disable-autolabeler: false

      - name: Summary
        run: |
          echo "✅ Release Drafter aktualisiert" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Draft-Release wird bei jedem PR-Merge aktualisiert." >> "$GITHUB_STEP_SUMMARY"
          echo "Label: feature/enhancement → Minor, bug/fix → Patch, major/breaking-change → Major" >> "$GITHUB_STEP_SUMMARY"
