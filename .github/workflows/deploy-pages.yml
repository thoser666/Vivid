name: Deploy / GitHub Pages

# Publiziert die statischen Seiten unter
# https://thoser666.github.io/Vivid/
#   - Landing Page (docs/index.md → docs/index.html): Feature-Übersicht +
#     Links zu README, user-guide.md, ai-chat-bot.md und Privacy
#   - Privacy Policy (PRIVACY.md → docs/privacy/index.html)
# (Workflow konvertiert beide Markdown-Quellen per Python markdown-Paket
#  und deployt docs/ via actions/configure-pages + upload-pages-artifact +
#  deploy-pages).
# Trigger: wenn PRIVACY.md oder docs/index.md sich ändern (oder manuell
# via workflow_dispatch).

on:
  push:
    branches: [develop]
    paths:
      - 'PRIVACY.md'
      - 'docs/index.md'
      - 'docs/fdroid/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Markdown → HTML (Landing + Privacy)
        # Markdown → HTML mit Python (markdown-Paket via pip; pandoc ist auf
        # den GitHub-Runnern nicht vorinstalliert). Ergebnis: docs/index.html
        # und docs/privacy/index.html mit gemeinsamer Navigation.
        run: |
          python3 -m pip install --quiet markdown
          python3 - <<'PYEOF'
          import markdown, pathlib

          # Platzhalter-Ersetzung statt .format(): die CSS-Klammern würden sonst
          # als Format-Platzhalter interpretiert (KeyError).
          TEMPLATE = '''<!DOCTYPE html>
          <html lang="__LANG__">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>__TITLE__</title>
            <style>
              /* Responsive Basis: kein horizontaler Seiten-Überlauf auf Mobile. */
              * { box-sizing: border-box; }
              html { -webkit-text-size-adjust: 100%; }
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                     max-width: 800px; margin: 0 auto; padding: 1rem;
                     line-height: 1.6; color: #1f2328; }
              h1, h2, h3 { line-height: 1.25; }
              nav { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem;
                    padding-bottom: .75rem; border-bottom: 1px solid #d0d7de; }
              nav a { color: #1a7f37; text-decoration: none; font-weight: 600; }
              nav a:hover { text-decoration: underline; }
              /* Breite Tabellen (z. B. Drittanbieter-Tabelle) scrollen horizontal
                 statt die Seite zu sprengen. */
              table { display: block; width: 100%; overflow-x: auto;
                      border-collapse: collapse; -webkit-overflow-scrolling: touch; }
              th, td { border: 1px solid #d0d7de; padding: .4rem .6rem; text-align: left; }
              th { background: #f6f8fa; }
              /* Lange URLs/Befehle umbrechen statt überlaufen. */
              code { background: #f6f8fa; padding: .1rem .3rem; border-radius: 4px;
                     overflow-wrap: break-word; word-break: break-word; }
              pre { overflow-x: auto; }
              a { overflow-wrap: break-word; word-break: break-word; }
              img { max-width: 100%; height: auto; }
            </style>
          </head>
          <body>
          <nav>
            <a href="/Vivid/">🏠 Vivid</a>
            <a href="/Vivid/privacy/">🔒 Datenschutz</a>
          </nav>
          __BODY__
          </body>
          </html>'''

          def build(src: str, out: str, title: str, lang: str) -> None:
              body = markdown.markdown(
                  pathlib.Path(src).read_text(encoding='utf-8'),
                  extensions=['tables', 'fenced_code', 'sane_lists'],
              )
              html = (TEMPLATE.replace('__TITLE__', title)
                              .replace('__LANG__', lang)
                              .replace('__BODY__', body))
              out_path = pathlib.Path(out)
              out_path.parent.mkdir(parents=True, exist_ok=True)
              out_path.write_text(html, encoding='utf-8')

          build('docs/index.md', 'docs/index.html', 'Vivid — IRL Streaming App', 'de')
          build('PRIVACY.md', 'docs/privacy/index.html', 'Vivid — Privacy Policy', 'en')
          PYEOF
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact (docs/)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
