# Snyk Security Scanning
# Analysiert Dependencies auf bekannte Schwachstellen (CVEs).
# Die frühere gradle-jdk17-Docker-Action ist abgekündigt; wir verwenden
# stattdessen die unterstützte Snyk-CLI mit explizitem JDK 17.
# Docs: https://docs.snyk.io/developer-tools/integrations/snyk-ci-cd-integrations/github-actions-for-snyk-setup-and-checking-for-vulnerabilities
#
# Dependabot-PRs: snyk-test ist geskippt (github.actor == dependabot[bot]) —
# Dependabot-PR-Runs erhalten keine Actions-Secrets (SNYK_TOKEN leer), der
# Test scheitert dort reproduzierbar an SNYK-0005 (Authentication error).
# Kein Überwachungsloch: Dependabot-Branches werden beim nächsten
# schedule/dispatch-Lauf (snyk-monitor + snyk-test auf dem Default-Branch)
# regulär gescannt.
#
# Härtung (2026-09-30): Snyk-CLI-/Backend-Infrastrukturfehler (Exit 2/3, z. B.
# SNYK-CLI-0000 "Enrichment of Test Failed" — transiente Snyk-Backend-Störung
# am 30.09.2026, Run 36702441187) werden bis zu 3-mal mit Backoff wiederholt.
# Echte high-severity-Befunde (Exit 1) schlagen sofort rot — kein Retry.

name: Security / Snyk

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: snyk-${{ github.ref }}
  cancel-in-progress: true

env:
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  SNYK_INTEGRATION_NAME: github-actions

jobs:
  snyk-test:
    name: Snyk Dependency Test
    # Job-Level-Skip für Dependabot (keine Secrets im PR-Context → SNYK-0005);
    # der Job erscheint in der PR-Checkliste neutral als skipped statt rot.
    # Fork-PRs ebenfalls geskippt: SNYK_TOKEN fließt nicht in Fork-PR-Runs (PR #230).
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          snyk-version: latest

      - name: Run Snyk test
        id: snyk-test
        continue-on-error: true
        run: |
          # Retry nur bei CLI-/Backend-Fehlern (Exit 2/3) — echte Befunde
          # (Exit 1) brechen sofort ab, damit kein Befund verschluckt wird.
          max_attempts=3
          attempt=1
          delay=30
          rc=0
          while true; do
            snyk test --all-projects \
              --exclude=build,.gradle \
              --policy-path="$GITHUB_WORKSPACE/.snyk" \
              --severity-threshold=high \
              --sarif-file-output=./snyk-results.sarif
            rc=$?
            if [ "$rc" -eq 0 ] || [ "$rc" -eq 1 ]; then
              break
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              break
            fi
            echo "Snyk CLI-Fehler (Exit $rc, Versuch $attempt/$max_attempts) — Retry in ${delay}s"
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done
          echo "snyk_test_rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # GitHub akzeptiert seit Ende September 2026 keine SARIF-Datei mit
      # mehreren Run-Objekten derselben Kategorie mehr (changelog 2025-07-21,
      # Enforcement traf uns erstmals am 30.09.2026, Run 36667123590 — Snyk
      # schreibt EIN Run-Objekt pro Projekt, aktuell 11 Stück, alle ohne
      # eigene Kategorie). Der Fixup vergibt je Run eine eigene Kategorie
      # (automationDetails.id) — die Datei bleibt eine, alle Befunde bleiben
      # in Code Scanning sichtbar, der Upload wird wieder akzeptiert.
      - name: Make SARIF categories unique per project
        if: always() && hashFiles('snyk-results.sarif') != ''
        run: |
          python -X utf8 - <<'PYEOF'
          import json
          path = "./snyk-results.sarif"
          with open(path, encoding="utf-8") as f:
              sarif = json.load(f)
          runs = sarif.get("runs", [])
          for i, run in enumerate(runs):
              run.setdefault("automationDetails", {})["id"] = "snyk-test/project-%d" % i
          with open(path, "w", encoding="utf-8") as f:
              json.dump(sarif, f)
          print("SARIF-Kategorien eindeutig gesetzt: %d Runs" % len(runs))
          PYEOF

      - name: Upload Snyk results to GitHub Code Scanning
        if: always() && hashFiles('snyk-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ./snyk-results.sarif

      - name: Snyk summary
        if: always()
        run: |
          {
            echo "## Snyk Security Scan"
            echo
            echo "| Feld | Wert |"
            echo "|------|------|"
            echo "| Trigger | ${{ github.event_name }} |"
            echo "| Branch | ${{ github.ref_name }} |"
            echo "| Severity threshold | high |"
            if [ -f snyk-results.sarif ]; then
              echo "| SARIF-Upload | ✅ |"
            else
              echo "| SARIF-Upload | ⚠️ Keine Datei erzeugt |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on high-severity findings or persistent CLI errors
        if: steps.snyk-test.outcome == 'failure'
        env:
          SNYK_TEST_RC: ${{ steps.snyk-test.outputs.snyk_test_rc }}
        run: |
          # Exit 1 (Snyk-Konvention) = Befunde >= severity-threshold -> rot.
          # Exit 2/3 = CLI-/Backend-Fehler: nach 3 Retry-Versuchen weiterhin
          # vorhanden -> rot (sichtbar), aber SARIF bleibt fehlend.
          if [ "$SNYK_TEST_RC" = "1" ]; then
            echo "Snyk hat hochkritische Schwachstellen gefunden (Exit 1)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Snyk CLI-Fehler nach 3 Retries persistiert (Exit $SNYK_TEST_RC)." >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1

  snyk-monitor:
    name: Snyk Monitor (Dashboard)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        with:
          snyk-version: latest

      - name: Run Snyk monitor
        run: |
          max_attempts=3
          attempt=1
          delay=30
          while [ "$attempt" -le "$max_attempts" ]; do
            if snyk monitor --all-projects --exclude=build,.gradle \
                --policy-path="$GITHUB_WORKSPACE/.snyk"; then
              exit 0
            fi
            rc=$?
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Snyk monitor nach $max_attempts Versuchen fehlgeschlagen (Exit $rc)."
              exit 1
            fi
            echo "Snyk monitor CLI-Fehler (Exit $rc, Versuch $attempt/$max_attempts) — Retry in ${delay}s"
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done

      - name: Summary
        if: always()
        run: |
          echo "## Snyk Monitor (Dashboard Update)" >> "$GITHUB_STEP_SUMMARY"
          echo "Dashboard aktualisiert: https://app.snyk.io" >> "$GITHUB_STEP_SUMMARY"
