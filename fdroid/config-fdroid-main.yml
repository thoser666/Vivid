# F-Droid Main Repository Configuration for Vivid (FOSS Build)
# This configuration is for the official F-Droid repository (f-droid.org).
# It builds from source WITHOUT Sentry (fully FOSS compliant features the
# `foss` Flavor: applicationId com.vivid.foss — siehe docs/distribution.md).
#
# ⚠️ Dieser Config-Abschnitt ist die SUBMISSION-VORLAGE. Der fertige Eintrag
# lebt in fdroid/metadata/com.vivid.foss.yml (gleiches Format) und wird pro
# Release von Hand gepflegt (versionName/versionCode/commit anheben — die
# versionCode stimmen deterministisch mit der release_beta-Lane überein:
# major*1e6 + minor*1e3 + patch*10 + stage, 0.5.14-beta → 5142).

# Repository metadata
repo_name: Vivid (F-Droid)
repo_icon: fdroid-icon.png
repo_description: "Vivid - Open Source IRL Streaming App (FOSS Build, no tracking)"

# Package metadata
Categories:
  - Internet
  - Entertainment
  - Multimedia

License: MIT

# Anti-features: NONE (this is a fully FOSS build — sent/tracking sind im foss-
# Flavor flavor-isoliert, BuildConfig.FOSS_BUILD=true, SentryOptOut-No-op)
AntiFeatures: {}

# Source code
SourceCode: https://github.com/thoser666/Vivid
IssueTracker: https://github.com/thoser666/Vivid/issues

# Changelog
Changelog: https://github.com/thoser666/Vivid/releases

# Web site
WebSite: https://thoser666.github.io/Vivid/

# Donate
Donate: https://github.com/sponsors/thoser666

# Build-Konfiguration (fdroiddata-Format für f-droid.org + IzzyOnDroid):
#   - Der foss-Flavor ist der FOSS-konforme Build (kein Sentry/Tracking):
#     Produkt-Flavor `foss` + Build-Type `release` → assembleFossRelease.
#   - output = app-foss-release.apk (Flavor-Pfad: apk/foss/release/).
#   - versionCode muss EXAKT dem Tag entsprechen (deterministisch, siehe
#     fastlane/release_safety.rb) — sonst blockt fdroidserver den Eintrag.
Builds:
  - versionName: 0.5.14-beta
    versionCode: 5142
    commit: v0.5.14-beta
    gradle:
      - assembleFossRelease
    output: app-foss-release.apk