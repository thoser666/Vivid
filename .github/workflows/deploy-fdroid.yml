name: Deploy / F-Droid

on:
  # Trigger on new releases
  release:
    types: [published]
  
  # Weekly update check
  schedule:
    - cron: '0 4 * * 1'
  
  # Manual trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., v0.5.7-beta)'
        required: false
        default: 'latest'

# Only one run at a time
concurrency:
  group: fdroid-repo
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-repo:
    name: Build F-Droid Repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      
      - name: Install fdroidserver
        run: pip install fdroidserver
      
      - name: Determine version to build
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.version }}" != "latest" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download APK from GitHub Release
        run: |
          cd fdroid
          mkdir -p repo
          gh release download ${{ steps.version.outputs.VERSION }} \
            --pattern "*.apk" \
            --pattern "*-unsigned.apk" \
            --dir ./repo/ \
            --skip-existing
          
          echo "Downloaded APKs:"
          ls -la repo/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build F-Droid repository
        env:
          F_DROID_KEYSTORE: ${{ secrets.F_DROID_KEYSTORE }}
          F_DROID_KEY_ALIAS: ${{ secrets.F_DROID_KEY_ALIAS }}
          F_DROID_KEY_PASSWORD: ${{ secrets.F_DROID_KEY_PASSWORD }}
          F_DROID_KEY_DNAME: ${{ secrets.F_DROID_KEY_DNAME }}
        run: |
          cd fdroid
          
          # Decode keystore from secret
          echo "$F_DROID_KEYSTORE" | base64 -d > keystore.p12
          
          # Create config with signing key AND metadata (no leading spaces!)
          cat > config.yml << EOF
          builds_dir: repo
          repo_url: https://thoser666.github.io/Vivid/fdroid/repo
          repo_name: Vivid
          repo_description: "Vivid - Open Source IRL Streaming App with Chat Bot & AI Features"
          repo_icon: icon.png
          archive_older: 0
          SourceCode: https://github.com/thoser666/Vivid
          Issues: https://github.com/thoser666/Vivid/issues
          WebSite: https://thoser666.github.io/Vivid/
          Changelog: https://github.com/thoser666/Vivid/releases
          Donate: https://github.com/sponsors/thoser666
          License: MIT
          Categories:
            - Internet
            - Entertainment
            - Multimedia
          keystorepass: ${F_DROID_KEY_PASSWORD}
          keypass: ${F_DROID_KEY_PASSWORD}
          repo_keyalias: ${F_DROID_KEY_ALIAS}
          keydname: ${F_DROID_KEY_DNAME}
          EOF
          
          # Create metadata directory for the app
          mkdir -p metadata/com.vivid/en-US/changelogs
          
          # Create metadata files that fdroid update will pick up
          echo "Vivid" > metadata/com.vivid/en-US/title.txt
          echo "Open source IRL streaming app with chat bot and AI features" > metadata/com.vivid/en-US/short_description.txt
          cat > metadata/com.vivid/en-US/full_description.txt << 'EOF'
          Vivid is an open-source IRL streaming application for Android.
          
          Features:
          - Live streaming via RTMP/SRT to Twitch, YouTube, Kick, and custom platforms
          - Real-time chat overlay with badges and emotes
          - AI-powered chat bot with configurable responses
          - Owner remote control commands
          - Dark mode with AMOLED support
          - Multi-language support (English, German, French)
          - Scene management and auto-switching
          - Real-time GPS overlay (altitude, speed, coordinates)
          - Custom RTMP/SRT endpoints
          
          Open Source: https://github.com/thoser666/Vivid
          Issues: https://github.com/thoser666/Vivid/issues
          EOF
          
          cat > metadata/com.vivid/en-US/changelogs/5072.txt << 'EOF'
          - Chat overlay with badges and emotes
          - AI chat bot with configurable responses
          - Owner remote control commands
          - Dark mode with AMOLED support
          - Multi-language support (EN, DE, FR)
          - Text widget with live data
          - In-app help documentation
          - Torch control
          - Fix: Settings page scrolling
          EOF
          
          # Generate repo index
          fdroid update --create-metadata -v
          
          # Verify repository was created
          if [ ! -f "repo/index.xml" ]; then
            echo "Error: Repository index.xml not created"
            exit 1
          fi
          
          echo "Repository built successfully"
          ls -la repo/
          
          # Cleanup keystore
          rm -f keystore.p12
      
      - name: Copy to docs/fdroid
        run: |
          # Ensure docs/fdroid/repo exists
          rm -rf docs/fdroid
          mkdir -p docs/fdroid
          
          # Copy repo files
          cp -r fdroid/repo docs/fdroid/
          
          # Copy QR code
          cp docs/fdroid-repo-qr.svg docs/fdroid/qr.svg
          
          # Verify
          echo "Files in docs/fdroid:"
          ls -la docs/fdroid/
          echo ""
          echo "Files in docs/fdroid/repo:"
          ls -la docs/fdroid/repo/
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check for new or changed files (git diff misses untracked dirs)
          git add docs/fdroid/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update F-Droid repository for ${{ steps.version.outputs.VERSION }}"
            git push
          fi
