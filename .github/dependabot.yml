# Dependabot Configuration for Vivid
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # Gradle Dependencies (libs.versions.toml)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    # Gruppierung Reduziert PR-Aufwand
    # WICHTIG: Dependabot braucht exakte Paketnamen, keine Wildcards!
    groups:
      # Kotlin Dependencies (stdlib, plugin, serialization)
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
      # Compose Dependencies (BOM, UI, Material)
      compose:
        patterns:
          - "androidx.compose*"
      # AndroidX Core (lifecycle, activity, navigation, constraintlayout)
      # ACHTUNG: Nur exakte Packages, die NICHT in andere Gruppen gehören!
      androidx:
        patterns:
          - "androidx.core*"
          - "androidx.lifecycle*"
          - "androidx.activity*"
          - "androidx.navigation*"
          - "androidx.hilt*"
          - "androidx.constraintlayout*"
          - "androidx.datastore*"
          - "androidx.arch*"
          - "androidx.test*"
      # Testing Dependencies
      testing:
        patterns:
          - "junit*"
          - "io.mockk*"
          - "org.mockito*"
          - "androidx.test*"
          - "app.cash.turbine*"
      # Networking Dependencies
      networking:
        patterns:
          - "io.ktor*"
          - "com.squareup.okhttp3*"
      # Media Dependencies
      media:
        patterns:
          - "androidx.media3*"
          - "io.coil-kt*"
    # Labels für bessere Übersicht
    labels:
      - "dependencies"
      - "gradle"
    # Commit-Message-Prefix
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions (SHA-Pins)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    # CodeQL-Familie muss IN EINEM PR landen: init/analyze/upload-sarif
    # verteilen sich auf 4 Pin-Stellen in 3 Workflows, und der K1.4-Vertrag
    # (scripts/test_codeql_kotlin.sh) verlangt Same-Release über ALLE
    # Stellen — Einzel-PRs sind strukturell unmergebar (Vorfall #290/#293,
    # 12.10.2026: zwei grüne Einzel-PRs, beide BLOCKED auf K1.4).
    # Exakte Paketnamen statt Wildcard (Hausregel wie bei den gradle-Gruppen).
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/init"
          - "github/codeql-action/analyze"
          - "github/codeql-action/upload-sarif"
    # SHA-Pins werden automatisch erkannt
    # Dependabot liest die `# vX`-Kommentare
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
