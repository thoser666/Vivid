name: GitHub Pages

# Publiziert PRIVACY.md als statische Seite unter
# https://thoser666.github.io/Vivid/privacy/
# (Workflow kopiert PRIVACY.md nach docs/privacy/index.html und deployt via
#  actions/configure-pages + upload-pages-artifact + deploy-pages).
# Trigger: nur wenn PRIVACY.md sich ändert (oder manuell via workflow_dispatch).

on:
  push:
    branches: [develop]
    paths:
      - 'PRIVACY.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: PRIVACY.md → docs/privacy/index.html
        # Markdown → HTML mit Python (markdown-Paket via pip; pandoc ist auf
        # den GitHub-Runnern nicht vorinstalliert). Ergebnis: docs/privacy/index.html
        run: |
          python3 -m pip install --quiet markdown
          python3 - <<'PYEOF'
          import markdown, pathlib
          src = pathlib.Path('PRIVACY.md').read_text(encoding='utf-8')
          body = markdown.markdown(src, extensions=['tables', 'fenced_code', 'sane_lists'])
          html = '''<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Vivid — Privacy Policy</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                     max-width: 800px; margin: 2rem auto; padding: 0 1rem;
                     line-height: 1.6; color: #1f2328; }
              h1, h2, h3 { line-height: 1.25; }
              table { border-collapse: collapse; width: 100%; }
              th, td { border: 1px solid #d0d7de; padding: .4rem .6rem; text-align: left; }
              th { background: #f6f8fa; }
              code { background: #f6f8fa; padding: .1rem .3rem; border-radius: 4px; }
            </style>
          </head>
          <body>
          {body}
          </body>
          </html>'''.format(body=body)
          out = pathlib.Path('docs/privacy')
          out.mkdir(parents=True, exist_ok=True)
          (out / 'index.html').write_text(html, encoding='utf-8')
          PYEOF
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact (docs/)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
