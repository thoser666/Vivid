name: Deploy / F-Droid

on:
  # Trigger on new releases
  release:
    types: [published]
  
  # Weekly update check
  schedule:
    - cron: '0 4 * * 1'
  
  # Manual trigger
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., v0.5.7-beta)'
        required: false
        default: 'latest'

# Only one run at a time
concurrency:
  group: fdroid-repo
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-repo:
    name: Build F-Droid Repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      
      - name: Install fdroidserver
        run: pip install fdroidserver
      
      - name: Determine version to build
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.version }}" != "latest" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION=$(gh release list --limit 1 --json tagName -q '.[0].tagName')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore persistent archive from git
        run: |
          # The archive/ directory is committed to git (docs/fdroid/archive) so that
          # older versions survive from run to run on GitHub Pages. Restore it into
          # the working copy before fdroid update merges fresh APKs into it.
          cd fdroid
          mkdir -p archive
          if [ -d "../docs/fdroid/archive" ]; then
            cp -n "../docs/fdroid/archive/"*.apk archive/ 2>/dev/null || true
            echo "Restored existing archive APKs:"
            ls -la archive/ 2>/dev/null || echo "  (no existing archive APKs)"
          else
            echo "No existing archive yet (first run)."
          fi
      
      - name: Download all release APKs
        run: |
          cd fdroid
          mkdir -p repo
          
          # Download APKs from ALL semver releases. fdroid update will move the
          # newest archive_older versions into repo/ and all older ones into
          # archive/ automatically. Each release's APK is prefixed with the tag
          # name to keep filenames unique in the shared directories.
          i=0
          for TAG in $(gh release list --limit 50 --json tagName -q '.[].tagName' | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' || true); do
            i=$((i + 1))
            TMP="/tmp/apk_$i"
            mkdir -p "$TMP"
            gh release download "$TAG" \
              --pattern "*.apk" \
              --pattern "*-unsigned.apk" \
              --dir "$TMP/" \
              --skip-existing || true
            for f in "$TMP"/*.apk; do
              [ -e "$f" ] || continue
              # Skip debug builds (0.0.1-alpha ships app-debug.apk)
              case "$(basename "$f")" in
                *debug*) echo "Skipping debug APK: $(basename "$f")"; continue;;
              esac
              cp "$f" "repo/${TAG}_$(basename "$f")"
            done
          done
          
          echo "Downloaded APKs into repo/:"
          ls -la repo/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build F-Droid repository (repo + archive)
        env:
          F_DROID_KEYSTORE: ${{ secrets.F_DROID_KEYSTORE }}
          F_DROID_KEY_ALIAS: ${{ secrets.F_DROID_KEY_ALIAS }}
          F_DROID_KEY_PASSWORD: ${{ secrets.F_DROID_KEY_PASSWORD }}
          F_DROID_KEY_DNAME: ${{ secrets.F_DROID_KEY_DNAME }}
        run: |
          cd fdroid
          
          # Decode keystore from secret
          echo "$F_DROID_KEYSTORE" | base64 -d > keystore.p12
          
          # Create config with signing key and the ARCHIVE repository.
          # archive_older controls how many versions stay in the main repo;
          # all older ones are moved to archive/ by fdroid update. Setting
          # archive_url + archive_name makes the F-Droid client recognise the
          # separate archive repository (fixes "no archive" warning).
          cat > config.yml << EOF
          builds_dir: repo
          repo_url: https://thoser666.github.io/Vivid/fdroid/repo
          repo_name: Vivid
          repo_description: "Vivid - Open Source IRL Streaming App with Chat Bot & AI Features"
          repo_icon: icon.png
          archive_older: 5
          archive_url: https://thoser666.github.io/Vivid/fdroid/archive
          archive_name: Vivid Archive
          archive_description: "Older versions of Vivid, kept available for downgrades and fallback."
          archive_icon: icon.png
          keystorepass: ${F_DROID_KEY_PASSWORD}
          keypass: ${F_DROID_KEY_PASSWORD}
          repo_keyalias: ${F_DROID_KEY_ALIAS}
          keydname: ${F_DROID_KEY_DNAME}
          EOF
          
          # Create metadata directory and YAML file for the app
          mkdir -p metadata
          cat > metadata/com.vivid.yml << 'EOF'
          Categories:
            - Internet
            - Entertainment
            - Multimedia
          License: MIT
          AutoName: Vivid
          Summary: Open source IRL streaming app with chat bot and AI features
          Description: |-
            <p>Vivid is an open-source IRL streaming application for Android.</p>
            <p><b>Features:</b></p>
            <ul>
              <li>Live streaming via RTMP/SRT to Twitch, YouTube, Kick, and custom platforms</li>
              <li>Real-time chat overlay with badges and emotes</li>
              <li>AI-powered chat bot with configurable responses</li>
              <li>Owner remote control commands</li>
              <li>Dark mode with AMOLED support</li>
              <li>Multi-language support (English, German, French)</li>
              <li>Scene management and auto-switching</li>
              <li>Real-time GPS overlay (altitude, speed, coordinates)</li>
              <li>Custom RTMP/SRT endpoints</li>
            </ul>
            <p><a href="https://github.com/thoser666/Vivid">Source Code</a> | <a href="https://github.com/thoser666/Vivid/issues">Bug Reports</a></p>
          WebSite: https://thoser666.github.io/Vivid/
          SourceCode: https://github.com/thoser666/Vivid
          IssueTracker: https://github.com/thoser666/Vivid/issues
          Donate: https://github.com/sponsors/thoser666
          Changelog: https://github.com/thoser666/Vivid/releases
          EOF
          
          # Generate both indices (repo/ + archive/). fdroid update reads the
          # existing archive/ dir, merges fresh APKs, moves older ones there
          # and writes index files for both repositories.
          fdroid update -v
          
          # Verify main repository was created
          if [ ! -f "repo/index.xml" ]; then
            echo "Error: Repository index.xml not created"
            exit 1
          fi
          
          echo "Main repository built successfully"
          ls -la repo/
          
          echo ""
          echo "Archive repository:"
          if [ -d archive ] && ls archive/*.apk 1>/dev/null 2>&1; then
            ls -la archive/
            if [ ! -f "archive/index.xml" ]; then
              echo "Error: Archive index.xml not created"
              exit 1
            fi
          else
            echo "  (no archived versions yet - keep at least $((5+1)) releases to populate it)"
          fi
          
          # Cleanup keystore
          rm -f keystore.p12
      
      - name: Copy to docs/fdroid
        run: |
          # Ensure docs/fdroid exists
          mkdir -p docs/fdroid
          
          # Refresh repo (freshly built each run)
          rm -rf docs/fdroid/repo
          cp -r fdroid/repo docs/fdroid/repo
          
          # Refresh archive (newer APKs appended; older APKs persisted via git)
          rm -rf docs/fdroid/archive
          if [ -d fdroid/archive ]; then
            mkdir -p docs/fdroid/archive
            cp -r fdroid/archive/. docs/fdroid/archive/
          fi
          
          # Copy QR code
          cp docs/fdroid-repo-qr.svg docs/fdroid/qr.svg
          
          # Verify
          echo "Files in docs/fdroid:"
          ls -la docs/fdroid/
          echo ""
          echo "Files in docs/fdroid/repo:"
          ls -la docs/fdroid/repo/
          if [ -d docs/fdroid/archive ]; then
            echo ""
            echo "Files in docs/fdroid/archive:"
            ls -la docs/fdroid/archive/
          fi
      
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage repo and archive (incl. new APKs + archive index)
          git add docs/fdroid/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update F-Droid repository (repo: latest 5, archive: all older versions)"
            git push
          fi
